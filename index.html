<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F4F4F">

<title>诗隐 · time whisper</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=ZCOOL+XiaoWei&display=swap');
:root{--ink:#1F1F1F;--paper:#F5F3EF;--accent:#2F4F4F;--gold:#2F4F4F;--light:#dedad4;--red:#a0352a;--green:#4a7c59;--gray:#7a7062}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Serif SC',serif;background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(31,31,31,.03),transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(47,79,79,.04),transparent 50%);pointer-events:none}
.app{max-width:480px;margin:0 auto;position:relative;z-index:1;padding-bottom:80px}
.header{text-align:center;padding:20px 16px 10px}
.header h1{font-family:'ZCOOL XiaoWei',serif;font-size:26px;color:var(--accent);letter-spacing:6px}
.header .date{font-size:13px;color:var(--gray);margin-top:4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.header .date:active{opacity:.6}
.poem-list-link{font-size:12px;color:var(--accent);margin-top:6px;cursor:pointer;text-decoration:underline}
.poem-list{margin-top:10px}
.poem-list-item{background:#fff;border:1px solid var(--light);border-radius:8px;padding:12px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:14px;transition:.2s}
.poem-list-item:active{background:var(--light)}
.poem-list-item{position:relative;overflow:hidden}
.poem-list-item .stamp{
  position:absolute;right:60px;top:50%;transform:translateY(-50%) rotate(-15deg);
  width:38px;height:38px;border:2.5px solid var(--red);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'ZCOOL XiaoWei',serif;font-size:13px;color:var(--red);
  letter-spacing:1px;opacity:0.85;
  box-shadow:inset 0 0 0 1.5px var(--red);
  background:radial-gradient(ellipse at 30% 30%,rgba(160,53,42,0.08),transparent 70%);
  pointer-events:none;
}
.poem-list-item .stamp::before{
  content:'';position:absolute;inset:-1px;border-radius:50%;
  background:repeating-conic-gradient(transparent 0deg,transparent 8deg,rgba(160,53,42,0.06) 9deg,transparent 10deg);
  pointer-events:none;
}
.poem-list-item.learned{background:rgba(160,53,42,0.03)}
.poem-list-item .pl-meta{font-size:12px;color:var(--gray)}
.pl-filters{margin-bottom:10px}
.pl-filter-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;align-items:center}
.pl-filter-label{font-size:11px;color:var(--gray);min-width:36px;letter-spacing:1px}
.pl-chip{padding:5px 12px;border:1px solid var(--light);border-radius:16px;font-size:12px;background:#fff;color:var(--gray);cursor:pointer;font-family:'Noto Serif SC',serif;transition:.2s;white-space:nowrap}
.pl-chip:active{transform:scale(.96)}
.pl-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pl-group-title{font-family:'ZCOOL XiaoWei',serif;font-size:14px;color:var(--accent);margin:14px 0 8px;padding-left:8px;border-left:2.5px solid var(--accent)}
.pl-group-title:first-of-type{margin-top:6px}
.pl-empty{text-align:center;color:var(--gray);font-size:13px;padding:20px 0}
.pl-count{font-size:11px;color:var(--gray);text-align:right;margin-bottom:6px}
.tabs{display:flex;justify-content:flex-start;gap:4px;padding:10px 16px;position:sticky;top:0;background:var(--paper);z-index:10;border-bottom:1px solid var(--light);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border:1px solid var(--light);border-radius:20px;font-size:13px;background:transparent;color:var(--gray);cursor:pointer;font-family:'Noto Serif SC',serif;transition:.2s;flex-shrink:0}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.page{display:none;padding:16px;animation:fi .3s}
.page.active{display:block}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.poem-card{border:1px solid var(--light);border-radius:14px;padding:24px 20px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.poem-card .card-deco{position:absolute;pointer-events:none;z-index:0}
.poem-card .card-char{position:absolute;right:-10px;top:-20px;font-size:100px;font-family:'ZCOOL XiaoWei',serif;pointer-events:none;z-index:0}
.poem-card>*{position:relative;z-index:1}
.poem-title{font-family:'ZCOOL XiaoWei',serif;font-size:22px;text-align:center;margin-bottom:4px}
.poem-meta{text-align:center;font-size:13px;color:var(--gray);margin-bottom:16px}
.poem-content{text-align:center;line-height:2.2;font-size:17px;letter-spacing:2px}
.theme-label{display:inline-block;font-size:10px;padding:2px 10px;border-radius:10px;margin-bottom:10px;letter-spacing:2px}
.reflection-box{background:linear-gradient(135deg,rgba(201,169,78,.1),rgba(139,69,19,.05));border-left:3px solid var(--accent);padding:14px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px;color:var(--accent);line-height:1.8;font-style:italic}
.section-title{font-family:'ZCOOL XiaoWei',serif;font-size:17px;color:var(--accent);margin:18px 0 10px;padding-left:10px;border-left:3px solid var(--accent)}
.section-title:first-child{margin-top:0}
.explain-item{padding:8px 0;border-bottom:1px dashed var(--light);font-size:14px;line-height:1.8}
.explain-item .orig{font-weight:700;margin-bottom:2px}
.explain-item .mean{color:var(--gray)}
.prose{font-size:14px;line-height:2;color:#4a4035;text-indent:2em}
.quiz-card{background:#fff;border:1px solid var(--light);border-radius:12px;padding:18px;margin-bottom:14px}
.quiz-type{font-size:12px;color:var(--accent);margin-bottom:6px;font-weight:700}
.quiz-q{font-size:15px;line-height:1.8;margin-bottom:14px}
.quiz-opt{display:block;width:100%;padding:11px 14px;border:1px solid var(--light);border-radius:8px;font-size:14px;cursor:pointer;background:#fff;text-align:left;font-family:'Noto Serif SC',serif;color:var(--ink);line-height:1.6;margin-bottom:6px;transition:.2s}
.quiz-opt:active{transform:scale(.98)}
.quiz-opt.correct{background:#e8f5e9;border-color:var(--green);color:var(--green)}
.quiz-opt.wrong{background:#fde8e8;border-color:var(--red);color:var(--red)}
.quiz-opt.disabled{pointer-events:none;opacity:.7}
.quiz-input{width:100%;padding:10px;border:1px solid var(--light);border-radius:8px;font-size:15px;font-family:'Noto Serif SC',serif;background:#fff;outline:none}
.quiz-input:focus{border-color:var(--accent)}
.quiz-btn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-family:'Noto Serif SC',serif;margin-top:6px}
.quiz-btn:disabled{opacity:.5}
.quiz-result{text-align:center;padding:10px;border-radius:8px;margin-top:8px;font-size:13px}
.quiz-result.correct{background:#e8f5e9;color:var(--green)}
.quiz-result.wrong{background:#fde8e8;color:var(--red)}
.quiz-nav{display:flex;gap:8px;margin-top:12px}
.quiz-nav button{flex:1}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{background:#fff;border:1px solid var(--light);border-radius:10px;padding:16px;text-align:center}
.stat-num{font-size:28px;font-weight:700;color:var(--accent)}
.stat-label{font-size:12px;color:var(--gray);margin-top:4px}
.history-item{background:#fff;border:1px solid var(--light);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.history-score{color:var(--accent);font-weight:700}

/* ── RANK BADGE ── */
.rank-card{background:linear-gradient(135deg,#f8f6f2,#eeebe5);border:1px solid var(--light);border-radius:14px;padding:22px 18px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden}
.rank-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(192,72,60,0.04),transparent 70%);pointer-events:none}
.rank-icon{font-size:44px;margin-bottom:6px}
.rank-name{font-family:'ZCOOL XiaoWei',serif;font-size:22px;color:var(--accent);letter-spacing:4px}
.rank-desc{font-size:12px;color:var(--gray);margin-top:4px;line-height:1.6}
.rank-progress{margin-top:14px}
.rank-bar-bg{height:8px;background:var(--light);border-radius:4px;overflow:hidden;margin-top:6px}
.rank-bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.rank-next{font-size:11px;color:var(--gray);margin-top:6px;display:flex;justify-content:space-between}

/* ── STREAK ── */
.streak-card{background:#fff;border:1px solid var(--light);border-radius:12px;padding:16px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.streak-fire{font-size:32px}
.streak-info{flex:1}
.streak-num{font-size:24px;font-weight:700;color:var(--accent)}
.streak-label{font-size:12px;color:var(--gray)}

/* ── HEATMAP ── */
.heatmap{margin-bottom:16px}
.heatmap-title{font-size:13px;color:var(--gray);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.heatmap-grid{display:flex;gap:3px;flex-wrap:wrap}
.heatmap-col{display:flex;flex-direction:column;gap:3px}
.heatmap-cell{width:14px;height:14px;border-radius:3px;background:var(--light)}
.heatmap-cell.l1{background:rgba(47,79,79,0.2)}
.heatmap-cell.l2{background:rgba(47,79,79,0.4)}
.heatmap-cell.l3{background:rgba(47,79,79,0.6)}
.heatmap-cell.l4{background:rgba(47,79,79,0.85)}
.heatmap-cell.today{box-shadow:0 0 0 1.5px var(--accent)}
.heatmap-weekdays{display:flex;flex-direction:column;gap:3px;margin-right:4px;justify-content:flex-start}
.heatmap-weekdays span{height:14px;font-size:9px;color:var(--gray);line-height:14px}
.heatmap-months{display:flex;margin-left:22px;margin-bottom:4px}
.heatmap-months span{font-size:9px;color:var(--gray)}

/* ── WRONG ANSWERS ── */
.wrong-item{background:#fff;border:1px solid var(--light);border-radius:10px;padding:14px;margin-bottom:8px}
.wrong-q{font-size:13px;color:var(--ink);line-height:1.7;margin-bottom:6px}
.wrong-meta{display:flex;justify-content:space-between;align-items:center}
.wrong-ans{font-size:12px;color:var(--green)}
.wrong-your{font-size:12px;color:var(--red)}
.wrong-poem{font-size:11px;color:var(--gray)}
.wrong-retry{padding:5px 14px;border:1px solid var(--accent);border-radius:14px;font-size:11px;color:var(--accent);background:transparent;cursor:pointer;font-family:'Noto Serif SC',serif}

/* ── 背景页增强 ── */
.bg-poet-card{background:#fff;border:1px solid var(--light);border-radius:14px;padding:20px 18px;margin-bottom:16px;position:relative;overflow:hidden}
.bg-poet-card::before{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(47,79,79,0.04),transparent 70%);pointer-events:none}
.bg-poet-header{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.bg-poet-avatar{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'ZCOOL XiaoWei',serif;font-size:28px;color:#fff;flex-shrink:0;position:relative;overflow:hidden}
.bg-poet-avatar::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent);pointer-events:none}
.bg-poet-info{flex:1;min-width:0}
.bg-poet-name{font-family:'ZCOOL XiaoWei',serif;font-size:20px;color:var(--accent);letter-spacing:2px}
.bg-poet-dates{font-size:12px;color:var(--gray);margin-top:2px}
.bg-poet-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.bg-poet-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(47,79,79,0.06);color:var(--accent);letter-spacing:1px}
.bg-poet-bio{font-size:13px;line-height:2;color:#4a4035;margin-top:4px}

.bg-story-card{background:linear-gradient(135deg,rgba(47,79,79,0.03),rgba(160,53,42,0.02));border:1px solid var(--light);border-radius:14px;padding:20px 18px;margin-bottom:16px;position:relative}
.bg-story-card::before{content:'📜';position:absolute;right:14px;top:12px;font-size:24px;opacity:0.15;pointer-events:none}
.bg-story-title{font-family:'ZCOOL XiaoWei',serif;font-size:15px;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.bg-story-title::before{content:'';display:inline-block;width:4px;height:16px;background:var(--red);border-radius:2px;opacity:0.6}
.bg-story-text{font-size:13px;line-height:2.1;color:#4a4035;text-indent:2em}

.bg-context-card{background:#fff;border:1px solid var(--light);border-radius:14px;padding:20px 18px;margin-bottom:16px}
.bg-context-title{font-family:'ZCOOL XiaoWei',serif;font-size:15px;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.bg-context-title::before{content:'';display:inline-block;width:4px;height:16px;background:var(--accent);border-radius:2px;opacity:0.6}

.bg-trivia-card{background:linear-gradient(135deg,rgba(201,169,78,0.06),rgba(47,79,79,0.04));border:1px dashed rgba(47,79,79,0.2);border-radius:14px;padding:18px 16px;margin-bottom:16px}
.bg-trivia-title{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:8px;letter-spacing:1px}
.bg-trivia-items{display:flex;flex-direction:column;gap:10px}
.bg-trivia-item{display:flex;gap:10px;font-size:13px;line-height:1.8;color:#4a4035;align-items:flex-start}
.bg-trivia-icon{flex-shrink:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:2px}

.bg-timeline{position:relative;padding-left:20px;margin:14px 0}
.bg-timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:1.5px;background:linear-gradient(to bottom,var(--accent),rgba(47,79,79,0.1))}
.bg-tl-item{position:relative;padding:6px 0 14px 14px;font-size:13px;line-height:1.8;color:#4a4035}
.bg-tl-item::before{content:'';position:absolute;left:-17px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--paper);border:2px solid var(--accent)}
.bg-tl-item:last-child{padding-bottom:0}
.bg-tl-year{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1px}

.bg-quote-box{background:rgba(47,79,79,0.04);border-radius:12px;padding:16px;margin:14px 0;text-align:center;position:relative}
.bg-quote-box::before,.bg-quote-box::after{font-family:'ZCOOL XiaoWei',serif;font-size:32px;color:var(--accent);opacity:0.15;position:absolute}
.bg-quote-box::before{content:'\201C';left:8px;top:2px}
.bg-quote-box::after{content:'\201D';right:8px;bottom:-6px}
.bg-quote-text{font-size:14px;color:var(--accent);line-height:2;font-style:italic;padding:0 16px}
.bg-quote-src{font-size:11px;color:var(--gray);margin-top:6px}

/* ── COVER ── */
#cover{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;
  overflow:hidden;
  transition:opacity .6s ease, transform .6s ease;
  background:#e8e2d6;
}
#cover.hide{opacity:0;transform:scale(1.04);pointer-events:none}
.cover-bg{position:absolute;inset:0;}
.cover-bg svg{width:100%;height:100%;object-fit:cover}
.cover-grad{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,
    rgba(232,226,214,0) 0%,
    rgba(232,226,214,0) 35%,
    rgba(232,226,214,0.4) 50%,
    rgba(228,222,210,0.85) 65%,
    rgba(225,218,206,0.97) 78%,
    rgba(222,215,202,1) 100%);
}
.cover-content{
  position:relative;z-index:2;
  display:flex;flex-direction:column;
  align-items:center;
  padding:0 32px 48px;
  width:100%;max-width:420px;
}
.c-seal{
  width:44px;height:44px;background:#C0483C;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:20px;box-shadow:0 4px 18px rgba(192,72,60,0.3);
  transform:rotate(-2deg);
}
.c-seal span{font-family:'ZCOOL XiaoWei',serif;color:#fff;font-size:19px;}
.c-title-cn{
  font-family:'ZCOOL XiaoWei',serif;
  font-size:min(76px,19vw);color:var(--ink);
  letter-spacing:18px;line-height:1;margin-bottom:8px;
  text-shadow:0 2px 12px rgba(31,31,31,0.06);
}
.c-title-en{
  font-size:14px;color:var(--accent);
  letter-spacing:6px;margin-bottom:20px;font-style:italic;
  opacity:0.7;
}
.c-rule{display:flex;align-items:center;gap:10px;margin-bottom:16px;width:180px;}
.c-rule-line{flex:1;height:1px;background:var(--accent);opacity:0.25;}
.c-rule-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:0.4;}
.c-tagline{font-size:13px;color:var(--gray);letter-spacing:3px;line-height:2.2;text-align:center;margin-bottom:28px;}
.c-btn{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--accent);color:#fff;border:none;border-radius:28px;
  padding:15px 40px;font-family:'ZCOOL XiaoWei',serif;
  font-size:17px;letter-spacing:4px;cursor:pointer;
  box-shadow:0 8px 32px rgba(47,79,79,0.3);
  transition:transform .15s,box-shadow .15s;
  -webkit-tap-highlight-color:transparent;
}
.c-btn:active{transform:scale(0.96)}
.c-teaser{margin-top:22px;text-align:center;opacity:0.6;}
.c-teaser-lbl{font-size:10px;color:var(--gray);letter-spacing:3px;margin-bottom:5px;}
.c-teaser-v{font-family:'ZCOOL XiaoWei',serif;font-size:15px;color:var(--ink);letter-spacing:2px;line-height:2;}
@keyframes cIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes cFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.c-seal{animation:cIn .7s .1s both}
.c-title-cn{animation:cIn .7s .25s both}
.c-title-en{animation:cIn .7s .35s both}
.c-rule,.c-tagline{animation:cIn .7s .4s both}
.c-btn{animation:cIn .7s .5s both}
.c-teaser{animation:cIn .7s .6s both}

/* ══════════════════ 分享卡片 ══════════════════ */
.share-btn{
  margin-top:14px;background:transparent;border:1px solid var(--light);
  border-radius:14px;padding:8px 18px;cursor:pointer;
  font-family:'Noto Serif SC',serif;font-size:13px;color:var(--gray);
  display:inline-flex;align-items:center;gap:6px;letter-spacing:2px;
  transition:.2s;-webkit-tap-highlight-color:transparent;
}
.share-btn:active{background:var(--light);transform:scale(.98)}
.share-btn svg{width:14px;height:14px}

.share-modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:20px;
  opacity:0;transition:opacity .25s;backdrop-filter:blur(4px);
}
.share-modal.active{display:flex;opacity:1}
.share-modal-inner{
  width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;
  max-height:100%;
}
.share-card-wrap{
  flex:1;overflow-y:auto;display:flex;justify-content:center;
  border-radius:12px;
}
.share-card-wrap img{
  width:100%;height:auto;display:block;border-radius:12px;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
}
.share-card-hint{
  font-size:12px;color:rgba(255,255,255,0.8);text-align:center;
  letter-spacing:1px;line-height:1.6;
}
.share-modal-btns{display:flex;gap:10px}
.share-modal-btn{
  flex:1;padding:13px;border:none;border-radius:12px;
  font-family:'Noto Serif SC',serif;font-size:14px;letter-spacing:3px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.share-modal-btn.primary{background:var(--paper);color:var(--accent);font-weight:700}
.share-modal-btn.secondary{background:rgba(255,255,255,0.15);color:#fff}
.share-modal-btn:active{transform:scale(.97)}

/* 卡片离屏渲染容器（始终存在但不可见，用于 html2canvas 截图） */
.share-card-stage{
  position:fixed;left:-9999px;top:0;width:750px;pointer-events:none;
}
.share-card{
  width:750px;height:1334px;position:relative;overflow:hidden;
  font-family:'Noto Serif SC',serif;
  padding:80px 70px;box-sizing:border-box;
  display:flex;flex-direction:column;
}
.share-card .sc-logo{
  text-align:center;position:relative;z-index:2;
}
.share-card .sc-logo-cn{
  font-family:'ZCOOL XiaoWei',serif;font-size:42px;letter-spacing:20px;
  color:var(--accent);padding-left:20px;
}
.share-card .sc-logo-en{
  font-size:14px;letter-spacing:8px;color:var(--gray);margin-top:6px;
}
.share-card .sc-label-wrap{
  text-align:center;margin-top:40px;position:relative;z-index:2;
}
.share-card .sc-label{
  display:inline-block;padding:6px 18px;border-radius:20px;
  font-size:16px;letter-spacing:4px;
}
.share-card .sc-title{
  font-family:'ZCOOL XiaoWei',serif;font-size:54px;color:var(--ink);
  text-align:center;letter-spacing:8px;margin-top:40px;position:relative;z-index:2;
}
.share-card .sc-meta{
  text-align:center;font-size:18px;color:var(--gray);
  margin-top:12px;letter-spacing:3px;position:relative;z-index:2;
}
.share-card .sc-content{
  margin-top:50px;text-align:center;position:relative;z-index:2;flex:1;
  display:flex;flex-direction:column;justify-content:center;
}
.share-card .sc-content p{
  font-size:32px;line-height:1.9;color:var(--ink);letter-spacing:4px;
  margin:4px 0;
}
.share-card .sc-ref{
  margin-top:40px;padding:20px 24px;font-size:20px;line-height:1.8;
  color:var(--ink);letter-spacing:2px;border-left:3px solid;
  text-align:left;position:relative;z-index:2;border-radius:0 8px 8px 0;
  font-style:italic;opacity:0.85;
}
.share-card .sc-watermark{
  text-align:center;margin-top:30px;position:relative;z-index:2;
}
.share-card .sc-wm-seal{
  display:inline-block;padding:8px 16px;border:1.5px solid var(--red);
  color:var(--red);font-family:'ZCOOL XiaoWei',serif;font-size:18px;
  letter-spacing:6px;border-radius:4px;opacity:0.85;
}
.share-card .sc-wm-sub{
  font-size:13px;color:var(--gray);letter-spacing:4px;margin-top:10px;
}
.share-card .sc-bg-char{
  position:absolute;font-family:'ZCOOL XiaoWei',serif;font-size:600px;
  opacity:0.05;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);
  pointer-events:none;line-height:1;
}
.share-card .sc-deco-svg{
  position:absolute;z-index:1;pointer-events:none;
}
</style>
</head>

<script>
const POEMS=[
{id:1,title:"静夜思",author:"李白",dynasty:"唐",content:["床前明月光，","疑是地上霜。","举头望明月，","低头思故乡。"],
explain:[["床前明月光","床前洒满明亮的月光"],["疑是地上霜","初看像地上铺了一层白霜"],["举头望明月","抬头仰望天上的明月"],["低头思故乡","不由低头思念远方的故乡"]],
appr:"全诗仅二十字，从「疑」到「举头」再到「低头」，月光成了触发乡愁的开关。语言朴素到极致，反而有穿越千年的力量。",
bg:"李白于726年旅居扬州时所作，时年26岁。唐代交通不便，离家往往数年不能归。开元盛世虽繁华，思乡是那个时代最普遍的情感。",
ref:"再繁华的他乡，也抵不过心底那盏故乡的灯。"},

{id:2,title:"春晓",author:"孟浩然",dynasty:"唐",content:["春眠不觉晓，","处处闻啼鸟。","夜来风雨声，","花落知多少。"],
explain:[["春眠不觉晓","春夜睡得香甜不觉天已亮"],["处处闻啼鸟","到处能听到鸟儿啼叫"],["夜来风雨声","回想昨夜阵阵风雨"],["花落知多少","不知多少花儿被吹落"]],
appr:"由喜转惜，短短四句完成情感起伏。以小见大写出对春光易逝的感慨。",
bg:"孟浩然是唐代山水田园派诗人，一生未入仕途，隐居襄阳鹿门山。李白曾写「吾爱孟夫子，风流天下闻」。",
ref:"美好的东西总是不经意间溜走，醒着的每一刻都值得珍惜。"},

{id:3,title:"登鹳雀楼",author:"王之涣",dynasty:"唐",content:["白日依山尽，","黄河入海流。","欲穷千里目，","更上一层楼。"],
explain:[["白日依山尽","夕阳沿着山峦缓缓落下"],["黄河入海流","黄河滚滚向大海奔流"],["欲穷千里目","想把千里风景都看尽"],["更上一层楼","那就再登上一层高楼"]],
appr:"前两句写景磅礴，后两句由景入理。想看得更远，必须站得更高。",
bg:"鹳雀楼位于今山西永济，唐代登临胜地。王之涣是盛唐边塞诗人，传世仅六首，首首精品。鹳雀楼后毁于战火，1997年重建。",
ref:"觉得人生到了瓶颈，可能只是还没走到下一个台阶。"},

{id:4,title:"江雪",author:"柳宗元",dynasty:"唐",content:["千山鸟飞绝，","万径人踪灭。","孤舟蓑笠翁，","独钓寒江雪。"],
explain:[["千山鸟飞绝","千座山岭看不到飞鸟"],["万径人踪灭","万条道路没有行人踪迹"],["孤舟蓑笠翁","只有孤舟上披蓑戴笠的老翁"],["独钓寒江雪","独自在寒江上垂钓"]],
appr:"「千山」「万径」是大，「孤舟」「独钓」是小，如一幅水墨画，聚焦风雪中倔强的身影——柳宗元自己的精神写照。",
bg:"柳宗元因永贞革新失败被贬永州十年。革新试图限制宦官权力，仅146天便被镇压，史称「二王八司马事件」。",
ref:"真正的强大，是在所有人都离开后，你依然能坐得住。"},

{id:5,title:"悯农",author:"李绅",dynasty:"唐",content:["锄禾日当午，","汗滴禾下土。","谁知盘中餐，","粒粒皆辛苦。"],
explain:[["锄禾日当午","正午烈日下农民锄草"],["汗滴禾下土","汗水滴落进泥土"],["谁知盘中餐","谁知盘中每粒粮食"],["粒粒皆辛苦","都包含农民无数辛劳"]],
appr:"前两句用画面说话，后两句反问收束，把个体辛苦上升为对劳动者的尊重。诗语浅白，力量重如千钧。",
bg:"李绅后官至宰相，据史料发达后生活奢靡。此诗作于年轻时目睹农民劳作有感而发。唐代均田制瓦解，土地兼并严重。",
ref:"懂得一个道理容易，难的是一辈子都照着去做。"},

{id:6,title:"惠崇春江晚景",author:"苏轼",dynasty:"宋",content:["竹外桃花三两枝，","春江水暖鸭先知。","蒌蒿满地芦芽短，","正是河豚欲上时。"],
explain:[["竹外桃花三两枝","竹林外两三枝桃花初放"],["春江水暖鸭先知","春天江水变暖鸭子最先感知"],["蒌蒿满地芦芽短","蒌蒿长满地面芦笋刚刚冒出短芽"],["正是河豚欲上时","正是河豚逆流而上的时候"]],
appr:"题画诗的经典。「春江水暖鸭先知」已成日常用语，意为实践出真知。苏轼从画中看出了画外之意，写出了春天到来时万物复苏的生机。",
bg:"苏轼为僧人惠崇的画作《春江晚景》题诗。苏轼不仅是文学家，也是美食家，他对河豚的提及体现了这一点。苏轼发明的东坡肉至今仍是名菜。",
ref:"最先感知变化的，永远是身在其中的人。"},

{id:7,title:"水调歌头",author:"苏轼",dynasty:"宋",content:["明月几时有？把酒问青天。","不知天上宫阙，今夕是何年。","我欲乘风归去，又恐琼楼玉宇，高处不胜寒。","起舞弄清影，何似在人间。","转朱阁，低绮户，照无眠。","不应有恨，何事长向别时圆？","人有悲欢离合，月有阴晴圆缺，此事古难全。","但愿人长久，千里共婵娟。"],
explain:[["明月几时有？把酒问青天","明月何时出现？端酒杯问苍天"],["不知天上宫阙，今夕是何年","不知天上宫殿今晚是哪年"],["我欲乘风归去，又恐琼楼玉宇，高处不胜寒","想乘风回天上又怕太寒冷"],["起舞弄清影，何似在人间","月下起舞弄影，天上哪比得上人间"],["转朱阁，低绮户，照无眠","月光转过朱阁照着无眠的人"],["不应有恨，何事长向别时圆","月亮为何偏在分别时才圆"],["人有悲欢离合，月有阴晴圆缺，此事古难全","悲欢离合阴晴圆缺自古难两全"],["但愿人长久，千里共婵娟","只愿所爱之人长久千里共赏月光"]],
appr:"中秋词巅峰。「高处不胜寒」既是物理感受也是政治隐喻，最后把个人思念升华为对天下离人的祝愿。",
bg:"写于1076年中秋，苏轼任密州太守，与弟苏辙七年未见。因反对王安石变法自请外放，政治不得志。",
ref:"世事不完美是常态，但不完美里依然有值得珍惜的东西。"},

{id:8,title:"念奴娇·赤壁怀古",author:"苏轼",dynasty:"宋",content:["大江东去，浪淘尽，千古风流人物。","故垒西边，人道是，三国周郎赤壁。","乱石穿空，惊涛拍岸，卷起千堆雪。","江山如画，一时多少豪杰。","遥想公瑾当年，小乔初嫁了，雄姿英发。","羽扇纶巾，谈笑间，樯橹灰飞烟灭。","故国神游，多情应笑我，早生华发。","人生如梦，一尊还酹江月。"],
explain:[["大江东去，浪淘尽，千古风流人物","长江东流，冲洗掉千古风流人物"],["故垒西边，人道是，三国周郎赤壁","旧营垒西边据说是周瑜大战的赤壁"],["乱石穿空，惊涛拍岸，卷起千堆雪","乱石插天巨浪拍岸卷起千堆浪花"],["江山如画，一时多少豪杰","江山如画涌现多少豪杰"],["遥想公瑾当年，小乔初嫁了，雄姿英发","遥想周瑜当年小乔刚嫁英姿勃发"],["羽扇纶巾，谈笑间，樯橹灰飞烟灭","摇扇戴巾谈笑间烧毁曹军战船"],["故国神游，多情应笑我，早生华发","神游故国应笑我多情早生白发"],["人生如梦，一尊还酹江月","人生如梦举杯洒酒向江月"]],
appr:"宋词中气势最磅礴之作。以周瑜年少有为反衬自己壮志未酬，「人生如梦」不是颓废而是看透后的洒脱。",
bg:"1082年苏轼因乌台诗案被贬黄州，政敌从诗文中摘句诬其讽刺新政，险些被杀。这段低谷反而成为创作黄金期。",
ref:"人生低谷时不要急着翻盘，有些沉淀只在最安静时才会发生。"},

{id:9,title:"题西林壁",author:"苏轼",dynasty:"宋",content:["横看成岭侧成峰，","远近高低各不同。","不识庐山真面目，","只缘身在此山中。"],
explain:[["横看成岭侧成峰","从正面看是山岭从侧面看是山峰"],["远近高低各不同","远近高低看到的景象各不相同"],["不识庐山真面目","认不清庐山的真正面貌"],["只缘身在此山中","只因为自己就在这山中"]],
appr:"写景即说理，庐山的千姿百态隐喻人生的复杂。「不识庐山真面目」成为千古名句，告诉我们当局者迷的道理。",
bg:"苏轼游庐山时所作。苏轼一生三次被贬，但始终保持乐观旷达。他在文学、书法、绘画、美食等方面都有极高成就，被誉为千古第一全才。",
ref:"看不清局面的时候，试着跳出来站远一点。"},

{id:10,title:"饮湖上初晴后雨",author:"苏轼",dynasty:"宋",content:["水光潋滟晴方好，","山色空蒙雨亦奇。","欲把西湖比西子，","淡妆浓抹总相宜。"],
explain:[["水光潋滟晴方好","水面波光粼粼晴天真美"],["山色空蒙雨亦奇","山色朦胧雨天也很奇妙"],["欲把西湖比西子","如果把西湖比作西施"],["淡妆浓抹总相宜","淡妆浓妆都很合适"]],
appr:"用西施比西湖，晴雨皆美如淡妆浓抹。比喻精妙绝伦，从此西湖有了「西子湖」的别称。",
bg:"苏轼任杭州通判时所作。他在杭州疏浚西湖、修建苏堤，留下了深远的政绩。苏轼是少有的既有文才又有政才的官员。",
ref:"真正的美，不挑环境，不挑天气。"},

{id:11,title:"定风波",author:"苏轼",dynasty:"宋",content:["莫听穿林打叶声，何妨吟啸且徐行。","竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。","料峭春风吹酒醒，微冷，山头斜照却相迎。","回首向来萧瑟处，归去，也无风雨也无晴。"],
explain:[["莫听穿林打叶声，何妨吟啸且徐行","不必理会穿林打叶的雨声，不妨吟咏长啸慢慢走"],["竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生","竹杖草鞋比骑马还轻快，怕什么？披一身蓑衣任凭风雨过一生"],["料峭春风吹酒醒，微冷，山头斜照却相迎","料峭春风吹醒酒意微感寒冷，山头斜阳却已迎面照来"],["回首向来萧瑟处，归去，也无风雨也无晴","回头看刚才风雨萧瑟的地方，回去吧，既没有风雨也没有晴"]],
appr:"表面写途中遇雨，实则写人生态度。「一蓑烟雨任平生」是苏轼一生的座右铭，「也无风雨也无晴」达到了超脱物我的境界。",
bg:"写于被贬黄州期间。一次出行遇雨，同行人皆狼狈，唯苏轼泰然自若。这首词是他面对人生风雨的宣言。",
ref:"淋过雨才知道，其实大多数事情都没什么大不了。"},

{id:12,title:"江城子·密州出猎",author:"苏轼",dynasty:"宋",content:["老夫聊发少年狂，左牵黄，右擎苍。","锦帽貂裘，千骑卷平冈。","为报倾城随太守，亲射虎，看孙郎。","酒酣胸胆尚开张，鬓微霜，又何妨！","持节云中，何日遣冯唐？","会挽雕弓如满月，西北望，射天狼。"],
explain:[["老夫聊发少年狂，左牵黄，右擎苍","我姑且发一回少年的豪情，左手牵黄犬右手托苍鹰"],["锦帽貂裘，千骑卷平冈","戴锦帽穿貂裘率千骑席卷山冈"],["为报倾城随太守，亲射虎，看孙郎","为报答全城人随我出猎，我要亲自射虎像当年孙权"],["酒酣胸胆尚开张，鬓微霜，又何妨","酒酣之际胸怀壮志，鬓边白发又有何妨"],["持节云中，何日遣冯唐","朝廷何时像派冯唐那样重新起用我"],["会挽雕弓如满月，西北望，射天狼","我定将弓拉满如满月，向西北方射下天狼星"]],
appr:"苏轼最豪放的词之一。以出猎写壮志，以孙权、冯唐的典故寄托渴望报国的雄心。「会挽雕弓如满月」气吞山河。",
bg:"写于密州任上。苏轼虽被外放，仍心系国事。当时西夏屡犯边境，苏轼渴望有机会为国效力。",
ref:"年龄从来不是热血的保质期。"},

{id:13,title:"江城子·乙卯正月二十日夜记梦",author:"苏轼",dynasty:"宋",content:["十年生死两茫茫，不思量，自难忘。","千里孤坟，无处话凄凉。","纵使相逢应不识，尘满面，鬓如霜。","夜来幽梦忽还乡，小轩窗，正梳妆。","相顾无言，惟有泪千行。","料得年年肠断处，明月夜，短松冈。"],
explain:[["十年生死两茫茫，不思量，自难忘","十年生死相隔茫茫，不去想也自然难忘"],["千里孤坟，无处话凄凉","千里之外的孤坟无处诉说凄凉"],["纵使相逢应不识，尘满面，鬓如霜","即使相逢也认不出我，满面风尘鬓发如霜"],["夜来幽梦忽还乡，小轩窗，正梳妆","夜里梦中忽然回到家乡，你在小窗前正在梳妆"],["相顾无言，惟有泪千行","四目相对无言以对只有泪流满面"],["料得年年肠断处，明月夜，短松冈","想必年年令人断肠的地方就是那明月下的短松冈"]],
appr:"中国文学史上最感人的悼亡词。「不思量，自难忘」六个字写尽了深爱的本质。梦中相逢「相顾无言」比千言万语更催人泪下。",
bg:"苏轼悼念亡妻王弗，王弗16岁嫁给苏轼，27岁病逝。此词写于王弗去世十年后，苏轼在密州任上梦见亡妻。",
ref:"有些人离开了，但从没真正走远。"},

{id:14,title:"望庐山瀑布",author:"李白",dynasty:"唐",content:["日照香炉生紫烟，","遥看瀑布挂前川。","飞流直下三千尺，","疑是银河落九天。"],
explain:[["日照香炉生紫烟","阳光照射香炉峰升起紫色烟雾"],["遥看瀑布挂前川","远望瀑布像白练挂在山前"],["飞流直下三千尺","水流从极高处飞泻而下"],["疑是银河落九天","让人怀疑是银河从天上落下"]],
appr:"极致夸张与浪漫想象。「生紫烟」有仙气，「挂前川」化动为静，「银河落九天」将人间与天上相连，气势如虹。",
bg:"李白于725年初出四川游历天下时所作。庐山位于江西九江，唐代已是佛道圣地，经此诗传颂后成为中国山水文化符号。",
ref:"有些气魄是装不出来的，它来自你见过的世面和走过的路。"},

{id:15,title:"将进酒",author:"李白",dynasty:"唐",content:["君不见黄河之水天上来，奔流到海不复回。","君不见高堂明镜悲白发，朝如青丝暮成雪。","人生得意须尽欢，莫使金樽空对月。","天生我材必有用，千金散尽还复来。"],
explain:[["君不见黄河之水天上来，奔流到海不复回","你没看到黄河之水从天而降奔向大海一去不回"],["君不见高堂明镜悲白发，朝如青丝暮成雪","你没看到镜中人感叹白发早晨黑发傍晚就白了"],["人生得意须尽欢，莫使金樽空对月","人生得意时应尽情欢乐不要让金杯空对明月"],["天生我材必有用，千金散尽还复来","上天赋予我才能必有用处千金花完还会再来"]],
appr:"李白最豪放的饮酒诗。「天生我材必有用」是千古自信宣言，在失意中依然相信自己的价值。",
bg:"此诗约作于752年，李白被唐玄宗赐金放还后，政治理想破灭，与友人岑夫子、丹丘生饮酒时所作。借酒浇愁却写出了不朽的豪情。",
ref:"自信不是觉得自己什么都行，而是知道自己值得。"},

{id:16,title:"送杜少府之任蜀州",author:"王勃",dynasty:"唐",content:["城阙辅三秦，风烟望五津。","与君离别意，同是宦游人。","海内存知己，天涯若比邻。","无为在歧路，儿女共沾巾。"],
explain:[["城阙辅三秦，风烟望五津","长安城被三秦拱卫透过烟雾遥望巴蜀"],["与君离别意，同是宦游人","与你离别心情相同我们都是漂泊做官的人"],["海内存知己，天涯若比邻","四海之内有知己即使天涯也像近邻"],["无为在歧路，儿女共沾巾","不要在岔路口像小儿女那样哭湿手帕"]],
appr:"「海内存知己，天涯若比邻」是中国最著名的友情名句。一扫送别诗的悲伤，以旷达重新定义离别。",
bg:"王勃是初唐四杰之首，6岁能文16岁中进士27岁溺水而亡。初唐诗风正从六朝绮靡向盛唐雄浑转变，四杰是关键推动者。",
ref:"真正的友情不怕距离，怕的是走着走着就不联系了。"},

{id:17,title:"送元二使安西",author:"王维",dynasty:"唐",content:["渭城朝雨浥轻尘，","客舍青青柳色新。","劝君更尽一杯酒，","西出阳关无故人。"],
explain:[["渭城朝雨浥轻尘","渭城早晨的雨润湿了路上的尘土"],["客舍青青柳色新","旅馆旁的柳树颜色青翠一新"],["劝君更尽一杯酒","劝你再干完这一杯酒"],["西出阳关无故人","向西出了阳关就再没有老朋友了"]],
appr:"被誉为唐代送别诗之冠。前两句以清新之景衬离别之情，后两句以一杯酒写尽千言万语。朴素中蕴含深情。",
bg:"王维送友人元二出使安西都护府（今新疆）。阳关是通往西域的关口，一出阳关便是荒漠。唐代丝绸之路繁忙，但西行路途艰险。",
ref:"有些送别，一杯酒就够了，因为所有的话都在酒里。"},

{id:18,title:"九月九日忆山东兄弟",author:"王维",dynasty:"唐",content:["独在异乡为异客，","每逢佳节倍思亲。","遥知兄弟登高处，","遍插茱萸少一人。"],
explain:[["独在异乡为异客","独自在他乡作为外乡人"],["每逢佳节倍思亲","每到佳节就更加思念亲人"],["遥知兄弟登高处","遥想兄弟们登高的时候"],["遍插茱萸少一人","插遍茱萸却少了我一个人"]],
appr:"「每逢佳节倍思亲」是中国人最常引用的诗句之一。最妙的是后两句不写自己思念，而写兄弟那边少了自己，角度一转更显深情。",
bg:"王维17岁时在长安写下此诗。重阳节有登高、插茱萸的习俗。王维是盛唐诗佛，诗画双绝，苏轼评其「诗中有画，画中有诗」。",
ref:"在热闹的人群里突然想起一个人，那就是思念。"},

{id:19,title:"春望",author:"杜甫",dynasty:"唐",content:["国破山河在，城春草木深。","感时花溅泪，恨别鸟惊心。","烽火连三月，家书抵万金。","白头搔更短，浑欲不胜簪。"],
explain:[["国破山河在，城春草木深","国都沦陷山河依旧，城中春天草木丛生"],["感时花溅泪，恨别鸟惊心","感伤时局花也让人落泪，怨恨离别鸟鸣也令人惊心"],["烽火连三月，家书抵万金","战火连续三个月，一封家书值万金"],["白头搔更短，浑欲不胜簪","白发越搔越少，简直插不住簪子了"]],
appr:"安史之乱中最沉痛的诗篇。「国破山河在」五个字写尽亡国之痛，「家书抵万金」道出战乱中最朴素的渴望。以个人之苦映射家国之难。",
bg:"756年安史之乱爆发，长安沦陷。杜甫被叛军困在长安城中，目睹国都残破景象。安史之乱是唐朝由盛转衰的转折点，持续八年，人口锐减数千万。",
ref:"家书抵万金——有些东西，只有失去了才知道有多珍贵。"},

{id:20,title:"登高",author:"杜甫",dynasty:"唐",content:["风急天高猿啸哀，渚清沙白鸟飞回。","无边落木萧萧下，不尽长江滚滚来。","万里悲秋常作客，百年多病独登台。","艰难苦恨繁霜鬓，潦倒新停浊酒杯。"],
explain:[["风急天高猿啸哀，渚清沙白鸟飞回","风急天高猿猴哀啸，水清沙白鸟儿盘旋"],["无边落木萧萧下，不尽长江滚滚来","无边落叶萧萧而下，不尽长江滚滚而来"],["万里悲秋常作客，百年多病独登台","万里漂泊常年客居他乡，年老多病独自登上高台"],["艰难苦恨繁霜鬓，潦倒新停浊酒杯","艰难困苦使白发增多，潦倒中刚刚停了浊酒"]],
appr:"被誉为「古今七律第一」。八句皆对仗，前四句写景壮阔苍凉，后四句抒情沉郁悲壮。「无边落木」「不尽长江」对仗堪称千古绝唱。",
bg:"写于767年杜甫流寓夔州时期，安史之乱后杜甫携家漂泊西南。此时他年老多病、穷困潦倒，国家也满目疮痍。三年后杜甫病逝于湘江舟中。",
ref:"扛过最难的日子，你会发现自己比想象中更坚韧。"},

{id:21,title:"浣溪沙",author:"苏轼",dynasty:"宋",content:["游蕲水清泉寺，寺临兰溪，溪水西流。","山下兰芽短浸溪，松间沙路净无泥，","萧萧暮雨子规啼。","谁道人生无再少？门前流水尚能西！","休将白发唱黄鸡。"],
explain:[["山下兰芽短浸溪","山下兰草嫩芽浸在溪水中"],["松间沙路净无泥","松林间的沙路干净没有泥"],["萧萧暮雨子规啼","傍晚细雨中杜鹃鸟啼叫"],["谁道人生无再少","谁说人生不能再回到年轻"],["门前流水尚能西","门前的流水还能向西流"],["休将白发唱黄鸡","不要因白发而感叹时光流逝"]],
appr:"苏轼式的乐观。溪水西流本是自然现象，他却从中悟出「人生无再少」的道理。面对衰老和困境，依然选择积极向上。",
bg:"写于被贬黄州期间。苏轼游蕲水清泉寺，见溪水西流有感而发。被贬期间他开荒种地、自号东坡居士，在困境中活出了自己的精彩。",
ref:"谁规定人生只能往一个方向走？"},

{id:22,title:"赤壁赋（节选）",author:"苏轼",dynasty:"宋",content:["清风徐来，水波不兴。","举酒属客，诵明月之诗，歌窈窕之章。","月出于东山之上，徘徊于斗牛之间。","白露横江，水光接天。"],
explain:[["清风徐来，水波不兴","清风缓缓吹来水面波澜不起"],["举酒属客，诵明月之诗，歌窈窕之章","举杯劝客吟诵明月的诗篇"],["月出于东山之上，徘徊于斗牛之间","月亮从东山上升起在斗牛星间徘徊"],["白露横江，水光接天","白茫茫的水气笼罩江面水光连着天际"]],
appr:"中国散文的巅峰之作。以优美的笔触描绘月夜泛舟赤壁的景象，进而探讨人生的短暂与永恒，最后达到物我两忘的境界。",
bg:"1082年苏轼被贬黄州，七月与友人泛舟赤壁。前后赤壁赋都写于这一年。苏轼在最困窘的时期写出了最旷达的文章。",
ref:"心静下来的时候，世界会呈现出完全不同的样子。"},

{id:23,title:"蝶恋花·春景",author:"苏轼",dynasty:"宋",content:["花褪残红青杏小，燕子飞时，绿水人家绕。","枝上柳绵吹又少，天涯何处无芳草！","墙里秋千墙外道，墙外行人，墙里佳人笑。","笑渐不闻声渐悄，多情却被无情恼。"],
explain:[["花褪残红青杏小","花瓣凋落后青涩的小杏子已经长出"],["燕子飞时，绿水人家绕","燕子飞舞时绿水环绕着人家"],["枝上柳绵吹又少","枝头柳絮被风越吹越少"],["天涯何处无芳草","天涯何处没有美好的芳草"],["墙里秋千墙外道","墙里有人荡秋千墙外是行人的路"],["墙外行人，墙里佳人笑","墙外行人听到墙里佳人的笑声"],["笑渐不闻声渐悄","笑声渐渐听不到了"],["多情却被无情恼","多情的人却被无情所烦恼"]],
appr:"上片写暮春景色，「天涯何处无芳草」旷达中带着安慰。下片写一个偶遇的小场景，多情与无情的对比，写尽了人生中那些擦肩而过的遗憾。",
bg:"苏轼被贬惠州时期所作。即使身处逆境，苏轼仍能在自然和生活小事中发现美和趣味。",
ref:"错过的不必遗憾，天涯何处无芳草。"},

{id:24,title:"望岳",author:"杜甫",dynasty:"唐",content:["岱宗夫如何？齐鲁青未了。","造化钟神秀，阴阳割昏晓。","荡胸生曾云，决眦入归鸟。","会当凌绝顶，一览众山小。"],
explain:[["岱宗夫如何？齐鲁青未了","泰山到底怎样？齐鲁大地都望不尽它的青翠"],["造化钟神秀，阴阳割昏晓","大自然将神奇和秀丽集中于此，山南山北分出明暗"],["荡胸生曾云","层云升起使心胸激荡"],["决眦入归鸟","睁大眼睛看归巢的飞鸟"],["会当凌绝顶，一览众山小","一定要登上泰山顶峰，俯瞰群山都变得渺小"]],
appr:"杜甫早年最有朝气的作品。「会当凌绝顶，一览众山小」是青年杜甫的豪情壮志，写出了不畏艰难勇于攀登的气概。",
bg:"杜甫年轻时漫游齐鲁，望泰山有感而作。此时杜甫意气风发，尚未经历安史之乱的磨难。泰山是五岳之首，自古帝王封禅之地。",
ref:"站在山脚下抬头看，觉得难；站在山顶上低头看，觉得值。"},

{id:25,title:"黄鹤楼送孟浩然之广陵",author:"李白",dynasty:"唐",content:["故人西辞黄鹤楼，","烟花三月下扬州。","孤帆远影碧空尽，","唯见长江天际流。"],
explain:[["故人西辞黄鹤楼","老朋友在黄鹤楼向我告别"],["烟花三月下扬州","在繁花似锦的三月去往扬州"],["孤帆远影碧空尽","孤帆的远影消失在碧空尽头"],["唯见长江天际流","只看见长江向天际奔流"]],
appr:"全诗无一「愁」字却写尽离愁。后两句以目送代替语言，「孤帆远影」「长江天际」画面感极强，留白之美令人回味无穷。",
bg:"李白在黄鹤楼送孟浩然去广陵（扬州）。李白对孟浩然极为仰慕。烟花三月的扬州是唐代最繁华的城市之一，盐商云集，富甲天下。",
ref:"最好的送别，是站在原地目送，直到看不见。"},

{id:26,title:"早发白帝城",author:"李白",dynasty:"唐",content:["朝辞白帝彩云间，","千里江陵一日还。","两岸猿声啼不住，","轻舟已过万重山。"],
explain:[["朝辞白帝彩云间","清晨从彩云缭绕的白帝城出发"],["千里江陵一日还","千里之外的江陵一天就到了"],["两岸猿声啼不住","两岸猿猴啼叫不断"],["轻舟已过万重山","轻快的小船已穿过万重山峦"]],
appr:"全诗充满轻快喜悦之情。「轻舟已过万重山」既写行船之快，也暗含李白遇赦后心情之轻快。一个「轻」字妙不可言。",
bg:"李白因永王李璘案被流放夜郎，行至白帝城时遇赦。欣喜若狂之下乘船东下，写下此诗。三峡水流湍急，顺流而下确实极快。",
ref:"熬过了至暗时刻，前面的路就会越走越轻。"},

{id:27,title:"凉州词",author:"王翰",dynasty:"唐",content:["葡萄美酒夜光杯，","欲饮琵琶马上催。","醉卧沙场君莫笑，","古来征战几人回？"],
explain:[["葡萄美酒夜光杯","甘醇的葡萄酒盛在夜光杯中"],["欲饮琵琶马上催","正要畅饮却听到马上弹起琵琶催促出发"],["醉卧沙场君莫笑","醉倒在沙场上请不要笑话"],["古来征战几人回","自古以来出征打仗能有几人活着回来"]],
appr:"豪迈中透着悲凉。明知九死一生，却依然举杯痛饮，这种视死如归的气概正是盛唐边塞精神的最好写照。",
bg:"唐代边塞诗的代表作。唐朝与西域各国交流频繁，葡萄酒、夜光杯都是西域传入的物品。边塞诗反映了唐代将士戍边的艰苦与豪情。",
ref:"明知不易，依然举杯——这就是勇气。"},

{id:28,title:"出塞",author:"王昌龄",dynasty:"唐",content:["秦时明月汉时关，","万里长征人未还。","但使龙城飞将在，","不教胡马度阴山。"],
explain:[["秦时明月汉时关","秦汉时的明月照着秦汉时的关塞"],["万里长征人未还","万里出征的将士至今未能回还"],["但使龙城飞将在","只要有像李广那样的飞将军在"],["不教胡马度阴山","就不会让敌人的骑兵越过阴山"]],
appr:"被誉为唐代七绝的压卷之作。「秦时明月汉时关」将时空拉到千年之前，感叹边患之久。后两句寄托对良将的渴望，含蓄批评当朝用人不当。",
bg:"王昌龄有「七绝圣手」之称。唐代北方边患不断，突厥、吐蕃屡犯边境。边塞诗既写将士的豪情，也写战争的残酷和对和平的渴望。",
ref:"问题往往不是没有人才，而是人才没有被放在对的位置上。"},

{id:29,title:"相见欢",author:"李煜",dynasty:"五代",content:["无言独上西楼，月如钩。","寂寞梧桐深院锁清秋。","剪不断，理还乱，是离愁。","别是一般滋味在心头。"],
explain:[["无言独上西楼，月如钩","默默无言独自登上西楼，月亮弯弯如钩"],["寂寞梧桐深院锁清秋","寂寞的梧桐树在深院中锁住了清秋"],["剪不断，理还乱，是离愁","剪不断理还乱的是离别的愁绪"],["别是一般滋味在心头","另有一种滋味涌上心头"]],
appr:"「剪不断，理还乱」用丝线比喻愁绪，形象至极，成为千古名句。全词以一个亡国之君的凄凉写出了所有人都能共鸣的离愁。",
bg:"李煜是南唐后主，才华横溢却不善治国。975年南唐被宋灭亡，李煜被俘至汴京，从帝王沦为阶下囚。此词写于亡国之后，最终李煜被宋太宗毒杀。",
ref:"有些苦说不出来，只能自己慢慢消化。"},

{id:30,title:"虞美人",author:"李煜",dynasty:"五代",content:["春花秋月何时了？往事知多少。","小楼昨夜又东风，故国不堪回首月明中。","雕栏玉砌应犹在，只是朱颜改。","问君能有几多愁？恰似一江春水向东流。"],
explain:[["春花秋月何时了？往事知多少","春花秋月什么时候才能完了？往事还记得多少"],["小楼昨夜又东风，故国不堪回首月明中","昨夜小楼又吹来东风，明月下不忍回想故国"],["雕栏玉砌应犹在，只是朱颜改","雕花栏杆和玉石台阶应该还在，只是人已衰老"],["问君能有几多愁？恰似一江春水向东流","问你有多少愁？就像那一江春水滚滚东流"]],
appr:"李煜绝命之作。「问君能有几多愁？恰似一江春水向东流」以具象写抽象，愁绪之多之深如江水般无穷无尽，成为写愁的千古绝唱。",
bg:"李煜被俘三年后写此词，据说宋太宗读后大怒，随即将其毒杀。李煜用生命写就了最后的词作，王国维评其「变伶工之词而为士大夫之词」。",
ref:"有些代价很大，但换来的东西也是永恒的。"},

{id:31,title:"如梦令",author:"李清照",dynasty:"宋",content:["常记溪亭日暮，沉醉不知归路。","兴尽晚回舟，误入藕花深处。","争渡，争渡，惊起一滩鸥鹭。"],
explain:[["常记溪亭日暮，沉醉不知归路","常常想起在溪亭游玩到日暮，喝醉了不知回去的路"],["兴尽晚回舟，误入藕花深处","尽兴后傍晚划船回家，不小心划进了荷花丛深处"],["争渡，争渡，惊起一滩鸥鹭","急着划急着划，惊飞了一片鸥鹭"]],
appr:"清新灵动的少女之作。「争渡，争渡」的急切，「惊起一滩鸥鹭」的意外，构成一幅生动活泼的画面。短短数句，情态毕现。",
bg:"李清照是宋代最杰出的女词人，号易安居士。此词写于她少女时代，描写了一次郊游的美好回忆。李清照出身书香门第，早年生活优裕幸福。",
ref:"最快乐的时光，往往是那些计划之外的意外。"},

{id:32,title:"声声慢",author:"李清照",dynasty:"宋",content:["寻寻觅觅，冷冷清清，凄凄惨惨戚戚。","乍暖还寒时候，最难将息。","三杯两盏淡酒，怎敌他、晚来风急！","雁过也，正伤心，却是旧时相识。"],
explain:[["寻寻觅觅，冷冷清清，凄凄惨惨戚戚","苦苦寻觅，冷冷清清，凄惨悲伤"],["乍暖还寒时候，最难将息","忽暖忽寒的时候最难调养身体"],["三杯两盏淡酒，怎敌他、晚来风急","几杯淡酒怎能抵挡傍晚的急风"],["雁过也，正伤心，却是旧时相识","大雁飞过正让人伤心，却是从前熟悉的那群"]],
appr:"开篇连用十四个叠字，前无古人后无来者，营造出无比凄凉的氛围。这是李清照晚年国破家亡、丧夫漂泊后写下的千古绝唱。",
bg:"靖康之变后，北宋灭亡，李清照随丈夫赵明诚南渡。不久赵明诚病逝，她孤身漂泊，收藏的金石书画也大多散失。从此她的词风从清丽转为凄婉。",
ref:"人生的后半场，拼的不是拥有多少，而是失去之后还能不能站住。"},

{id:33,title:"破阵子",author:"辛弃疾",dynasty:"宋",content:["醉里挑灯看剑，梦回吹角连营。","八百里分麾下炙，五十弦翻塞外声。","沙场秋点兵。","马作的卢飞快，弓如霹雳弦惊。","了却君王天下事，赢得生前身后名。","可怜白发生！"],
explain:[["醉里挑灯看剑，梦回吹角连营","醉中挑亮灯光看宝剑，梦中回到号角连天的军营"],["八百里分麾下炙，五十弦翻塞外声","将烤肉分给将士们，军乐演奏塞外的战歌"],["沙场秋点兵","秋天在沙场上检阅军队"],["马作的卢飞快，弓如霹雳弦惊","战马像的卢一样飞快，弓弦如霹雳般震响"],["了却君王天下事，赢得生前身后名","完成收复天下的大业，赢得生前身后的英名"],["可怜白发生","可惜已经满头白发"]],
appr:"全词慷慨激昂，最后三字「白发生」急转直下，梦想与现实的巨大落差令人心碎。豪放中的悲凉，是辛弃疾最打动人的地方。",
bg:"辛弃疾是南宋最伟大的词人，也是抗金英雄。21岁率50人闯入金营擒拿叛徒。南归后却长期不被重用，只能在词中抒发壮志难酬的悲愤。",
ref:"最遗憾的事不是做不到，而是明明做得到却没有机会。"},

{id:34,title:"青玉案·元夕",author:"辛弃疾",dynasty:"宋",content:["东风夜放花千树，更吹落、星如雨。","宝马雕车香满路，凤箫声动，玉壶光转，一夜鱼龙舞。","蛾儿雪柳黄金缕，笑语盈盈暗香去。","众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。"],
explain:[["东风夜放花千树，更吹落、星如雨","东风吹开千树花灯，烟火纷纷如星雨坠落"],["宝马雕车香满路","豪华的马车带着香气驶过"],["凤箫声动，玉壶光转，一夜鱼龙舞","箫声响起灯火流转，鱼龙灯舞了一整夜"],["蛾儿雪柳黄金缕，笑语盈盈暗香去","女子们戴着华美头饰笑语盈盈飘然而去"],["众里寻他千百度","在人群中寻找她千百遍"],["蓦然回首，那人却在，灯火阑珊处","猛然回头，那人却在灯火零落的地方"]],
appr:"写元宵之夜的繁华热闹，最后笔锋一转，那个不在热闹中的人才是要找的人。王国维将末句视为治学最高境界：历尽繁华后的顿悟。",
bg:"写于南宋时期的元宵节。辛弃疾以「灯火阑珊处」的那人自喻——在举国歌舞升平中，他是那个独自忧国的清醒者。",
ref:"你要找的答案，往往不在最热闹的地方。"},

{id:35,title:"满江红",author:"岳飞",dynasty:"宋",content:["怒发冲冠，凭栏处、潇潇雨歇。","抬望眼、仰天长啸，壮怀激烈。","三十功名尘与土，八千里路云和月。","莫等闲、白了少年头，空悲切！"],
explain:[["怒发冲冠，凭栏处、潇潇雨歇","怒发冲冠倚着栏杆，急雨刚刚停歇"],["抬望眼、仰天长啸，壮怀激烈","抬头远望仰天长啸，壮志豪情激荡"],["三十功名尘与土，八千里路云和月","三十年的功名如同尘土，八千里征途伴着云月"],["莫等闲、白了少年头，空悲切","不要虚度光阴让少年头发白了，到那时只剩空自悲切"]],
appr:"中国最激昂的爱国词篇。「莫等闲、白了少年头，空悲切」是对所有年轻人的警醒。全词慷慨悲壮，字字铿锵，读之令人热血沸腾。",
bg:"岳飞是南宋抗金名将，一生致力于收复中原。他率领岳家军屡破金兵，却被秦桧以「莫须有」的罪名杀害于风波亭，年仅39岁。",
ref:"最怕的不是来不及，而是根本没有开始。"},

{id:36,title:"钱塘湖春行",author:"白居易",dynasty:"唐",content:["孤山寺北贾亭西，水面初平云脚低。","几处早莺争暖树，谁家新燕啄春泥。","乱花渐欲迷人眼，浅草才能没马蹄。","最爱湖东行不足，绿杨阴里白沙堤。"],
explain:[["孤山寺北贾亭西，水面初平云脚低","在孤山寺北贾亭西，湖水刚与堤平云层低垂"],["几处早莺争暖树，谁家新燕啄春泥","几处早来的黄莺争着飞向暖树，不知谁家新来的燕子衔泥筑巢"],["乱花渐欲迷人眼，浅草才能没马蹄","各色野花渐渐要让人眼花缭乱，浅草刚刚能没过马蹄"],["最爱湖东行不足，绿杨阴里白沙堤","最喜爱的是湖东走不够的，绿杨阴里的白沙堤"]],
appr:"写西湖早春，处处扣住一个「早」字。莺是「早莺」，燕是「新燕」，花是「渐欲」，草是「才能」，精准捕捉了春天刚刚到来的微妙时刻。",
bg:"白居易任杭州刺史时所作。他在杭州修筑白堤，至今仍是西湖著名景点。白居易主张「文章合为时而著，诗歌合为事而作」，是唐代新乐府运动的倡导者。",
ref:"最好的风景，往往在你愿意慢下来的时候才能看到。"},

{id:37,title:"长恨歌（节选）",author:"白居易",dynasty:"唐",content:["在天愿作比翼鸟，在地愿为连理枝。","天长地久有时尽，此恨绵绵无绝期。"],
explain:[["在天愿作比翼鸟，在地愿为连理枝","在天上愿做比翼齐飞的鸟，在地上愿做枝干相连的树"],["天长地久有时尽，此恨绵绵无绝期","即使天长地久也有尽头，但这遗恨却绵绵不绝永无终期"]],
appr:"《长恨歌》写唐玄宗与杨贵妃的爱情悲剧，结尾这四句是千古爱情名言。「天长地久有时尽」的绝望与「此恨绵绵」的深情交织，震撼人心。",
bg:"白居易以唐玄宗与杨贵妃的故事为题材。安史之乱中，唐玄宗被迫在马嵬坡赐死杨贵妃。这段帝王爱情悲剧成为中国文学最经典的爱情题材之一。",
ref:"有些感情，穿越了时间，依然让人心疼。"},

{id:38,title:"琵琶行（节选）",author:"白居易",dynasty:"唐",content:["千呼万唤始出来，犹抱琵琶半遮面。","同是天涯沦落人，相逢何必曾相识！"],
explain:[["千呼万唤始出来，犹抱琵琶半遮面","千呼万唤她才缓缓走出，怀里抱着琵琶半遮着脸"],["同是天涯沦落人，相逢何必曾相识","同样是漂泊天涯的失意人，今日相逢何必在意以前是否认识"]],
appr:"「同是天涯沦落人，相逢何必曾相识」道出了所有失意人的心声。白居易以琵琶女的身世自比，两个素不相识的人因共同的遭遇而产生深深的共鸣。",
bg:"白居易被贬江州司马，在浔阳江头送客时偶遇一位琵琶女。琵琶女年少时红极一时，后来年老色衰嫁给商人，丈夫常年在外。白居易感同身受，写下此诗。",
ref:"真正的理解，不需要解释，只需要经历过。"},

{id:39,title:"行路难",author:"李白",dynasty:"唐",content:["金樽清酒斗十千，玉盘珍羞直万钱。","停杯投箸不能食，拔剑四顾心茫然。","欲渡黄河冰塞川，将登太行雪满山。","长风破浪会有时，直挂云帆济沧海。"],
explain:[["金樽清酒斗十千，玉盘珍羞直万钱","金杯中的美酒一斗值十千，玉盘里的菜肴值万钱"],["停杯投箸不能食，拔剑四顾心茫然","放下杯子丢下筷子吃不下，拔出剑环顾四周心中茫然"],["欲渡黄河冰塞川，将登太行雪满山","想渡黄河却被冰堵住河道，想登太行山却大雪封山"],["长风破浪会有时，直挂云帆济沧海","终有一天会乘长风破万里浪，高挂云帆横渡沧海"]],
appr:"前半首写尽了怀才不遇的苦闷，后两句突然一转，「长风破浪会有时」喊出了不屈的信念。这种从绝望到希望的巨大反转，正是李白式的浪漫。",
bg:"李白被唐玄宗「赐金放还」后所作，实际上是被赶出了朝廷。政治理想破灭，前路迷茫，但李白的天性让他无法长久消沉。",
ref:"路被堵死的时候，别急着回头，前面可能还有一片海。"},

{id:40,title:"望天门山",author:"李白",dynasty:"唐",content:["天门中断楚江开，","碧水东流至此回。","两岸青山相对出，","孤帆一片日边来。"],
explain:[["天门中断楚江开","天门山被长江从中劈开"],["碧水东流至此回","碧绿的江水东流到此回旋"],["两岸青山相对出","两岸青山相对而立"],["孤帆一片日边来","一片孤帆从太阳旁边驶来"]],
appr:"写长江天门山的壮美。「相对出」赋予青山动感，「日边来」给孤帆增添了诗意。短短四句，画面开阔，气象万千。",
bg:"天门山位于安徽当涂，东西两山夹江对峙如门。李白25岁初出蜀地，乘舟沿长江东下，沿途写下多首描绘长江风景的诗篇。",
ref:"人生的壮阔风景，只有在出发之后才能看到。"},

{id:41,title:"乌衣巷",author:"刘禹锡",dynasty:"唐",content:["朱雀桥边野草花，","乌衣巷口夕阳斜。","旧时王谢堂前燕，","飞入寻常百姓家。"],
explain:[["朱雀桥边野草花","朱雀桥边长满了野草野花"],["乌衣巷口夕阳斜","乌衣巷口夕阳西斜"],["旧时王谢堂前燕","从前王家谢家堂前的燕子"],["飞入寻常百姓家","如今飞进了普通百姓家中"]],
appr:"以燕子为线索写沧桑巨变。王、谢是东晋最显赫的家族，如今只剩野草夕阳。不直接感叹，让燕子替他说话，含蓄蕴藉，余味无穷。",
bg:"乌衣巷位于南京，东晋时王导、谢安等豪门大族聚居于此。刘禹锡被贬二十三年后路过金陵，见昔日繁华已成往事，写下这首怀古名篇。",
ref:"没有什么是永恒的，包括你现在拥有的一切。"},

{id:42,title:"竹枝词",author:"刘禹锡",dynasty:"唐",content:["杨柳青青江水平，","闻郎江上踏歌声。","东边日出西边雨，","道是无晴却有晴。"],
explain:[["杨柳青青江水平","杨柳青翠江水平静"],["闻郎江上踏歌声","听到江上小伙子的歌声"],["东边日出西边雨","东边出太阳西边下着雨"],["道是无晴却有晴","说它不晴吧却又有晴"]],
appr:"「晴」谐音「情」，巧妙地写出了恋爱中忽喜忽忧的微妙心理。全诗清新明快，是中国最早最精彩的谐音双关情诗之一。",
bg:"刘禹锡被贬至巴蜀期间，受当地民歌启发创作竹枝词。刘禹锡被称为「诗豪」，性格刚强，虽被贬二十三年但从不消沉。",
ref:"感情这种事，半明半暗的时候最美。"},

{id:43,title:"枫桥夜泊",author:"张继",dynasty:"唐",content:["月落乌啼霜满天，","江枫渔火对愁眠。","姑苏城外寒山寺，","夜半钟声到客船。"],
explain:[["月落乌啼霜满天","月亮落下乌鸦啼叫霜气弥漫"],["江枫渔火对愁眠","江边枫树和渔火伴着愁绪入眠"],["姑苏城外寒山寺","苏州城外的寒山寺"],["夜半钟声到客船","半夜的钟声传到我的客船上"]],
appr:"写旅人夜泊的孤独。月落、乌啼、霜天、渔火，一连串意象营造出清冷的氛围。那一声「夜半钟声」，打破了寂静，却让孤独更深了。",
bg:"张继进士落第后，途经苏州时所作。寒山寺因此诗名扬天下，至今每年除夕仍有听钟声的传统活动。一首诗让一座寺庙名垂千古。",
ref:"睡不着的夜晚，反而能听到平时听不到的声音。"},

{id:44,title:"回乡偶书",author:"贺知章",dynasty:"唐",content:["少小离家老大回，","乡音无改鬓毛衰。","儿童相见不相识，","笑问客从何处来。"],
explain:[["少小离家老大回","年少时离开家乡年老了才回来"],["乡音无改鬓毛衰","口音没有改变但鬓发已经稀疏"],["儿童相见不相识","村里的小孩见了我不认识"],["笑问客从何处来","笑着问客人从哪里来"]],
appr:"时间的残酷与温柔尽在其中。「乡音无改」是不变，「鬓毛衰」是变，「不相识」是最深的物是人非。被孩子叫「客人」的那一刻，才是真正的心酸。",
bg:"贺知章86岁辞官回乡，离家已五十多年。他是唐代著名诗人和书法家，与李白是忘年交，曾读李白的诗称赞他为「谪仙人」。",
ref:"你以为的归来，在别人眼里可能只是一次到访。"},

{id:45,title:"题临安邸",author:"林升",dynasty:"宋",content:["山外青山楼外楼，","西湖歌舞几时休？","暖风熏得游人醉，","直把杭州作汴州。"],
explain:[["山外青山楼外楼","青山之外还有青山楼阁之外还有楼阁"],["西湖歌舞几时休","西湖边的歌舞什么时候才能停止"],["暖风熏得游人醉","暖洋洋的风把游人吹得醉醺醺"],["直把杭州作汴州","简直把杭州当成了从前的汴京"]],
appr:"辛辣的讽刺诗。南宋偏安杭州，朝廷和百姓沉迷享乐，早忘了北方的半壁江山。「直把杭州作汴州」一语道破醉生梦死的现实。",
bg:"北宋灭亡后南宋定都临安（杭州）。朝廷不思收复中原，权贵纵情享乐。林升将此诗题写在旅店墙壁上，表达对朝廷苟安的愤慨。",
ref:"活在舒适区太久，会忘了自己本来应该去哪里。"},

{id:46,title:"示儿",author:"陆游",dynasty:"宋",content:["死去元知万事空，","但悲不见九州同。","王师北定中原日，","家祭无忘告乃翁。"],
explain:[["死去元知万事空","死后本来就知道万事皆空"],["但悲不见九州同","但悲伤的是看不到国家统一"],["王师北定中原日","等到朝廷军队收复中原的那天"],["家祭无忘告乃翁","家祭时不要忘了告诉你们的父亲"]],
appr:"陆游的绝笔诗，临终遗言只有一个心愿——看到国家统一。「但」字一转，万事皆空唯有家国不能放下，这种至死不渝的爱国情感震撼人心。",
bg:"陆游85岁病逝前写下此诗。他一生主张抗金收复中原，却屡遭主和派打压。陆游一生写诗近万首，是中国存诗最多的诗人。他至死未能看到国家统一。",
ref:"有些执念，不是放不下，而是不应该放下。"},

{id:47,title:"游山西村",author:"陆游",dynasty:"宋",content:["莫笑农家腊酒浑，","丰年留客足鸡豚。","山重水复疑无路，","柳暗花明又一村。"],
explain:[["莫笑农家腊酒浑","不要笑话农家的酒浑浊"],["丰年留客足鸡豚","丰收年景招待客人鸡肉猪肉管够"],["山重水复疑无路","山峦重叠溪水环绕以为没有路了"],["柳暗花明又一村","柳树成荫繁花似锦又出现一个村庄"]],
appr:"「山重水复疑无路，柳暗花明又一村」是中国人最常用的哲理名句。在以为走投无路时突然柳暗花明，写尽了人生的峰回路转。",
bg:"陆游罢官回到家乡山阴后所作。虽然政治上失意，但在乡村生活中他感受到了淳朴的人情和自然的美好。",
ref:"走到觉得走不动的时候，再坚持几步看看。"},

{id:48,title:"过零丁洋",author:"文天祥",dynasty:"宋",content:["辛苦遭逢起一经，干戈寥落四周星。","山河破碎风飘絮，身世浮沉雨打萍。","惶恐滩头说惶恐，零丁洋里叹零丁。","人生自古谁无死？留取丹心照汗青。"],
explain:[["辛苦遭逢起一经","辛苦读书靠科举起家"],["干戈寥落四周星","抗元战争已经过了四年"],["山河破碎风飘絮","国家破碎像风中飘飞的柳絮"],["身世浮沉雨打萍","个人命运像雨中浮萍"],["惶恐滩头说惶恐","在惶恐滩头说着惶恐的话"],["零丁洋里叹零丁","在零丁洋里感叹孤苦零丁"],["人生自古谁无死","人生自古以来谁能不死"],["留取丹心照汗青","留下这颗赤诚之心照亮史册"]],
appr:"中国最壮烈的爱国诗篇。「人生自古谁无死？留取丹心照汗青」是中华民族气节的最强音，激励了无数后人。",
bg:"文天祥是南宋末年丞相，率军抗元兵败被俘。元军劝降，他写下此诗表明心志。被囚三年后从容就义，年仅47岁。",
ref:"人这一辈子，总要有些东西比生命更重要。"},

{id:49,title:"己亥杂诗",author:"龚自珍",dynasty:"清",content:["浩荡离愁白日斜，","吟鞭东指即天涯。","落红不是无情物，","化作春泥更护花。"],
explain:[["浩荡离愁白日斜","满怀离愁在夕阳西斜时离去"],["吟鞭东指即天涯","扬起马鞭向东方就是天涯"],["落红不是无情物","落下的花瓣不是无情之物"],["化作春泥更护花","化作春泥后更加滋养新花"]],
appr:"「落红不是无情物，化作春泥更护花」是对奉献精神的最美诠释。花落不是终结而是新的开始，个人的退场也可以成为后来者的养分。",
bg:"龚自珍辞官离京时所作。他是清代最重要的思想家之一，主张改革弊政。鸦片战争前夕，他已敏锐地预见到清朝的危机，但改革主张不被采纳，愤而辞官。",
ref:"离开不代表放弃，换一种方式继续发光。"},

{id:50,title:"临江仙·夜登小阁忆洛中旧游",author:"陈与义",dynasty:"宋",content:["忆昔午桥桥上饮，坐中多是豪英。","长沟流月去无声，杏花疏影里，吹笛到天明。","二十余年如一梦，此身虽在堪惊。","闲登小阁看新晴，古今多少事，渔唱起三更。"],
explain:[["忆昔午桥桥上饮，坐中多是豪英","回忆当年在午桥上饮酒，在座的多是英豪"],["长沟流月去无声，杏花疏影里，吹笛到天明","月影随长沟流水无声而去，在杏花疏影里吹笛到天亮"],["二十余年如一梦，此身虽在堪惊","二十多年过去恍如一梦，身体虽然还在却令人心惊"],["闲登小阁看新晴","闲来登上小阁看雨后新晴"],["古今多少事，渔唱起三更","古往今来多少事，都在三更的渔歌中消散"]],
appr:"上片忆旧，杏花月夜吹笛何其美好。下片回到现实，「二十余年如一梦」的感叹，「古今多少事」的超脱，在回忆与现实间完成了对人生的沉思。",
bg:"陈与义经历了靖康之变，从北宋的太平盛世走到南宋的偏安一隅。二十年间天翻地覆，昔日的朋友们也已零落。此词是对整个时代的感慨。",
ref:"回头看，人生不过是一场大梦；往前走，梦里的每一步都算数。"}
];

// ── 诗人小传 ──
const POET_BIOS={
'李白':{dates:'701—762',bg:'#6b4c3b',tags:['诗仙','浪漫主义','盛唐'],
bio:'李白，字太白，号青莲居士，祖籍陇西成纪，生于西域碎叶城（今吉尔吉斯斯坦）。五岁随父迁居四川，少年时便以诗才闻名。二十五岁出蜀，仗剑去国辞亲远游，足迹遍布大半个中国。性格豪放不羁，好饮酒、喜交友。天宝元年（742年）被唐玄宗召入宫中，授翰林供奉，但仅三年便被"赐金放还"。晚年因参与永王之乱被流放，遇赦后病逝于当涂。一生留诗近千首，与杜甫并称"李杜"。',
quote:'笔落惊风雨，诗成泣鬼神。——杜甫评李白'},
'孟浩然':{dates:'689—740',bg:'#4a7c59',tags:['山水田园','布衣诗人','隐士'],
bio:'孟浩然，襄阳人，一生未入仕途，是唐代山水田园派的代表诗人。早年在鹿门山隐居，后漫游长安、洛阳，结识王维、李白等人。四十岁时赴长安应试落第，从此归隐田园。其诗清淡自然、意境悠远，开盛唐山水诗之先河。李白赞其"吾爱孟夫子，风流天下闻"，王维曾在书房挂其画像朝夕瞻仰。',
quote:'吾爱孟夫子，风流天下闻。——李白《赠孟浩然》'},
'王之涣':{dates:'688—742',bg:'#9a7030',tags:['边塞诗人','盛唐','传世仅六首'],
bio:'王之涣，并州（今山西太原）人，盛唐著名边塞诗人。性格豪爽，常击剑悲歌。仕途坎坷，曾任文安县尉等小官。他传世诗作仅六首，但首首精品，《登鹳雀楼》《凉州词》等脍炙人口。据说他与高适、王昌龄曾在旗亭画壁赛诗，传为千古佳话。',
quote:'王之涣六首诗，首首经典，可谓以少胜多的典范。'},
'柳宗元':{dates:'773—819',bg:'#3a5a6a',tags:['唐宋八大家','永州贬谪','古文运动'],
bio:'柳宗元，字子厚，河东（今山西运城）人，世称"柳河东"。二十一岁中进士，才华出众，参与王叔文领导的永贞革新，试图限制宦官和藩镇势力。改革仅146天失败，柳宗元被贬永州十年，后又贬至柳州，四年后病逝，年仅四十七岁。贬谪期间写下大量山水游记和寓言，为唐宋八大家之一，与韩愈并称"韩柳"。',
quote:'虽万受摈弃，不更乎其内。——柳宗元自述'},
'李绅':{dates:'772—846',bg:'#8a6530',tags:['新乐府运动','悯农诗人','官至宰相'],
bio:'李绅，字公垂，亳州人。幼年丧父，由母亲教育成人。青年时目睹农民疾苦，写下《悯农》二首，名传天下。后来官至宰相，但据史料记载，他晚年生活奢靡，一餐耗费数百贯，与早年体恤农民之情判若两人，令人唏嘘。他也是新乐府运动的参与者，与元稹、白居易齐名。',
quote:'初心易得，始终难守。——后人评李绅'},
'苏轼':{dates:'1037—1101',bg:'#2F4F4F',tags:['千古全才','豪放词派','东坡居士'],
bio:'苏轼，字子瞻，号东坡居士，眉州眉山（今四川）人。二十岁中进士，才华震动京城。一生三次被贬——黄州、惠州、儋州，却在逆境中创作出最伟大的作品。他是文学家、书法家、画家、美食家，发明东坡肉、东坡豆腐等菜肴，在各地任职期间兴修水利、赈济灾民。与父苏洵、弟苏辙并称"三苏"，为唐宋八大家之一。王国维评其词"以宋词之美，几于一人"。',
quote:'问汝平生功业，黄州惠州儋州。——苏轼自嘲'},
'王勃':{dates:'650—676',bg:'#6a4a7a',tags:['初唐四杰','天才少年','英年早逝'],
bio:'王勃，字子安，绛州龙门（今山西河津）人。六岁能文，九岁读《汉书》并指出颜师古注的错误，十六岁成为朝廷最年轻的进士。因写《斗鸡赋》被逐出王府，后又因擅杀官奴犯罪。二十七岁赴交趾探望父亲途中渡海溺水而亡。短暂一生留下八十余篇诗文，《滕王阁序》和《送杜少府之任蜀州》均为千古名篇。',
quote:'海内存知己，天涯若比邻。——王勃'},
'王维':{dates:'701—761',bg:'#5a7a5a',tags:['诗佛','诗画双绝','山水田园'],
bio:'王维，字摩诘，河东蒲州（今山西运城）人。少年时便以诗画闻名，二十一岁中状元。精通音律、绘画，晚年归隐终南山辋川别业，过着半官半隐的生活。他虔诚信佛，诗中常有禅意。安史之乱中被迫接受伪职，乱平后因弟弟王缙请求削官赎罪才免于处罚。苏轼评其"诗中有画，画中有诗"。',
quote:'诗中有画，画中有诗。——苏轼评王维'},
'杜甫':{dates:'712—770',bg:'#5a4535',tags:['诗圣','现实主义','忧国忧民'],
bio:'杜甫，字子美，号少陵野老，河南巩县人。少时胸怀大志，漫游各地。三十五岁赴长安求仕十年不得志，亲历安史之乱后携家流离。一生颠沛困顿，却用诗歌记录下了那个时代最真实的苦难。他的诗被称为"诗史"，与李白并称"李杜"。晚年漂泊湘江，五十九岁病逝于一叶孤舟之上。一生留诗约一千五百首。',
quote:'尔曹身与名俱灭，不废江河万古流。——杜甫'},
'刘禹锡':{dates:'772—842',bg:'#7a4a3a',tags:['诗豪','性格刚烈','贬谪二十三年'],
bio:'刘禹锡，字梦得，洛阳人，自称中山靖王之后。才华横溢，与柳宗元同年中进士。因参与永贞革新失败被贬朗州，此后辗转贬谪二十三年。他性格刚强，被贬后写下"前度刘郎今又来"，再次触怒权贵，又被贬出京。白居易称其"诗豪"，感叹"彭城刘梦得，诗豪者也"。晚年与白居易交好，互相唱和，合称"刘白"。',
quote:'沉舟侧畔千帆过，病树前头万木春。——刘禹锡'},
'张继':{dates:'约715—约779',bg:'#4a5a6a',tags:['进士落第','一诗成名','中唐'],
bio:'张继，字懿孙，襄州（今湖北襄阳）人。生平记载不多，天宝十二年（753年）中进士。但真正让他名垂千古的，是落第时途经苏州写下的《枫桥夜泊》。这首诗让寒山寺从一座普通小庙变成了闻名中外的名胜古迹，至今每年除夕仍有数万人来此听钟声。可以说，一首诗改变了一座寺庙的命运。',
quote:'一首诗让寒山寺名扬天下，堪称文学改变地理的典范。'},
'贺知章':{dates:'659—744',bg:'#6a5a4a',tags:['四明狂客','忘年交','书法家'],
bio:'贺知章，字季真，越州永兴（今浙江萧山）人。三十七岁中状元，在朝为官五十年，历经武则天、唐玄宗等朝。性格旷达，自号"四明狂客"。八十六岁辞官归乡，唐玄宗亲自饯行。他与李白是忘年交，初见李白便惊为"谪仙人"，解下金龟换酒，成为文坛佳话。',
quote:'此天上谪仙人也！——贺知章初见李白'},
'白居易':{dates:'772—846',bg:'#5a6a5a',tags:['诗魔','新乐府运动','通俗易懂'],
bio:'白居易，字乐天，号香山居士。祖籍太原，生于河南新郑。他主张"文章合为时而著，诗歌合为事而作"，倡导新乐府运动。据说他每写一首诗，都要读给不识字的老妇人听，直到对方能听懂才满意。一生留诗三千余首，是唐代存诗最多的诗人。他在杭州修白堤、在苏州开水利，留下了深远的政绩。晚年寓居洛阳香山，与元稹并称"元白"。',
quote:'童子解吟长恨曲，胡儿能唱琵琶篇。——唐代流传'},
'李煜':{dates:'937—978',bg:'#6a3a4a',tags:['南唐后主','词中之帝','亡国之君'],
bio:'李煜，字重光，南唐最后一位君主。他精通诗词、书画、音律，是五代最杰出的词人。作为帝王他无能治国，作为词人他才华无双。975年南唐被宋所灭，李煜被俘至汴京，过了三年阶下囚的生活。他将亡国之痛化为词作，开创了词的全新境界。王国维评价他"变伶工之词而为士大夫之词"。978年七月七日生辰之夜，被宋太宗赐牵机药毒杀，年仅四十二岁。',
quote:'做个才人真绝代，可怜薄命作君王。——后人评李煜'},
'李清照':{dates:'1084—约1155',bg:'#8a5a6a',tags:['千古第一才女','易安居士','婉约词宗'],
bio:'李清照，号易安居士，济南人。出身书香门第，父亲李格非是苏轼学生。十八岁嫁给赵明诚，夫妇志趣相投，共同收藏金石书画。早年生活优裕幸福，词风清丽活泼。靖康之变后随夫南渡，不久赵明诚病逝，她孤身漂泊，收藏散失殆尽。晚年词风从清丽变为凄婉，写下"寻寻觅觅"等千古名篇。她是中国文学史上最伟大的女词人。',
quote:'生当作人杰，死亦为鬼雄。——李清照'},
'辛弃疾':{dates:'1140—1207',bg:'#5a3a2a',tags:['词中之龙','抗金英雄','豪放词派'],
bio:'辛弃疾，字幼安，号稼轩，济南历城人。出生时北方已被金朝占领。二十一岁率五十人闯入数万人的金军大营，擒拿叛徒张安国，一战成名。南归后满腔热血却长期不被重用，只能在词中抒发壮志难酬的悲愤。晚年被起用又被弃用，最终含恨病逝，临终大呼"杀贼！杀贼！"一生写词六百余首，与苏轼并称"苏辛"。',
quote:'众里寻他千百度，蓦然回首，那人却在灯火阑珊处。——辛弃疾'},
'岳飞':{dates:'1103—1142',bg:'#3a4a3a',tags:['精忠报国','抗金名将','民族英雄'],
bio:'岳飞，字鹏举，相州汤阴（今河南）人。出身农家，少年习武。从军后屡建奇功，率领岳家军北伐，连破金兵，收复大片失地。正当节节胜利之时，宋高宗连下十二道金牌召回，秦桧以"莫须有"的罪名将其杀害于临安风波亭，年仅三十九岁。岳飞之死成为中国历史上最令人痛心的冤案之一。',
quote:'天日昭昭，天日昭昭！——岳飞临终遗言'},
'陆游':{dates:'1125—1210',bg:'#4a5a4a',tags:['爱国诗人','存诗万首','壮志未酬'],
bio:'陆游，字务观，号放翁，越州山阴（今浙江绍兴）人。一生主张抗金收复中原，但屡遭主和派打压。曾在前线指挥作战，写下"楼船夜雪瓜洲渡，铁马秋风大散关"。他也是中国历史上存诗最多的诗人，一生写诗近万首。八十五岁临终前写下《示儿》，至死未能看到国家统一。他与唐琬的爱情悲剧也广为流传。',
quote:'王师北定中原日，家祭无忘告乃翁。——陆游绝笔'},
'文天祥':{dates:'1236—1283',bg:'#4a3a3a',tags:['状元宰相','民族英雄','从容就义'],
bio:'文天祥，字宋瑞，号文山，吉州庐陵（今江西吉安）人。二十岁中状元，才华出众。南宋末年元兵南下，他变卖家产组织义军抗元。兵败被俘后，元朝多次劝降，许以高官厚禄，他宁死不屈。被囚三年间写下《正气歌》等名篇。1283年从容就义于大都（今北京），年仅四十七岁。临刑时面南而拜，慨然赴死。',
quote:'孔曰成仁，孟曰取义，唯其义尽，所以仁至。——文天祥'},
'龚自珍':{dates:'1792—1841',bg:'#5a5a4a',tags:['近代思想先驱','改革先声','清代'],
bio:'龚自珍，字璱人，号定庵，浙江仁和（今杭州）人。出身世宦之家，二十七岁中举人，三十八岁中进士。他目光敏锐，在鸦片战争前便预见清朝的危机，主张改革弊政、禁止鸦片。但改革主张不被采纳，愤而辞官南归。归途中写下《己亥杂诗》315首，记录了他的思想与情感。辞官仅两年后便暴卒，年仅五十岁，死因成谜。',
quote:'九州生气恃风雷，万马齐喑究可哀。——龚自珍'},
'林升':{dates:'约1123—约1189',bg:'#6a6a5a',tags:['南宋','讽刺诗人','题壁诗'],
bio:'林升，字云友，温州平阳人。关于他的生平记载极少，只知他是南宋时期一位读书人。他最著名的事迹就是在临安（杭州）一家旅店的墙壁上题写了《题临安邸》。这首题壁诗犹如一记警钟，讽刺南宋朝廷偏安一隅、醉生梦死。诗作一出，广为传诵。',
quote:'直把杭州作汴州。——林升'},
'王翰':{dates:'约687—约726',bg:'#8a7050',tags:['盛唐','边塞诗人','性格豪放'],
bio:'王翰，字子羽，并州晋阳（今山西太原）人。出身富裕家庭，性格豪放不羁，好饮酒。中进士后仕途不顺，因性格狂放被贬谪。他留传的诗作不多，但《凉州词》"葡萄美酒夜光杯"一首便足以让他名留千古，被誉为唐代边塞诗的巅峰之作。',
quote:'醉卧沙场君莫笑，古来征战几人回。——王翰'},
'王昌龄':{dates:'698—757',bg:'#7a6040',tags:['七绝圣手','边塞诗人','盛唐'],
bio:'王昌龄，字少伯，河东晋阳（今山西太原）人。中进士后长期担任小官，晚年被贬龙标尉。他擅长七言绝句，被誉为"七绝圣手"，存诗约一百八十首，其中七绝七十余首。安史之乱中被亳州刺史闾丘晓杀害，死因至今成谜。李白曾为他写下"我寄愁心与明月，随君直到夜郎西"。',
quote:'洛阳亲友如相问，一片冰心在玉壶。——王昌龄'},
'陈与义':{dates:'1090—1139',bg:'#5a6a6a',tags:['江西诗派','南北宋之交','避乱诗人'],
bio:'陈与义，字去非，号简斋，洛阳人。早年生活安逸，在洛阳与友人诗酒唱和。靖康之变后，他从北宋的太平盛世走入南宋的偏安乱世，一路南逃，经历了二十余年的天翻地覆。他的诗词也从早期的清丽转为苍凉深沉，成为南北宋之交最重要的诗人之一。',

const POEM_STORIES={
1:{title:'月夜独酌的游子',text:'726年，二十六岁的李白第一次离开故乡四川，沿长江东下，来到扬州。繁华的扬州城让他大开眼界，但越是热闹，越觉得孤独。一个秋天的夜晚，他独自躺在旅舍床上，看到窗前洒满的月光，恍惚间以为是地上结了一层白霜。抬头望月，低头时思绪已飘回了千里之外的家乡。这首二十个字的小诗，成了中国人最普遍的思乡记忆。',trivia:['李白一生中仅回过一次故乡','「床」在唐代也可指井栏或胡床（折叠椅）','这首诗在日本家喻户晓，是日语教材的必选篇目']},
2:{title:'鹿门山的隐士生活',text:'孟浩然一生不曾做官。四十岁那年他赴长安应试，本有机会在唐玄宗面前一展才华，却因一句"不才明主弃"惹怒皇帝，从此与仕途绝缘。他回到襄阳鹿门山，与鹤、松为伴，在晨光与鸟鸣中度过余生。《春晓》便是这种生活的真实写照——睡到自然醒，听鸟鸣，惜落花，简单到极致却透着真正的自由。',trivia:['孟浩然是唐代少有的终身未入仕的著名诗人','李白曾专程去襄阳拜访孟浩然','「春眠不觉晓」几乎是每个中国孩子学的第一首诗']},
3:{title:'旗亭画壁的传说',text:'传说王之涣与高适、王昌龄在长安旗亭（酒楼）饮酒，见歌女们唱诗，便打赌看谁的诗被唱得最多。先后有歌女唱了高适和王昌龄的诗。最后一位最美的歌女开口唱的正是王之涣的《凉州词》。虽然这个故事可能是后人杜撰，但王之涣的诗确实以音韵铿锵、气势雄浑闻名，特别适合配乐歌唱。',trivia:['鹳雀楼原楼毁于元初战火','1997年鹳雀楼在原址附近重建','王之涣传世仅六首诗，但首首经典']},
4:{title:'永州十年的孤独',text:'805年，柳宗元参与的永贞革新仅持续146天便宣告失败。三十三岁的他被贬到永州（今湖南零陵），这一去就是十年。永州偏远荒僻，柳宗元"投迹山水间"，用文字排解内心的苦闷。《江雪》中"千山鸟飞绝、万径人踪灭"的极寒世界，正是他内心孤绝处境的投射。那个在风雪中独自垂钓的老翁，就是柳宗元自己——被整个世界抛弃，却依然倔强地活着。',trivia:['永贞革新的领导者王叔文最终被赐死','柳宗元在永州写下了著名的《永州八记》','他在柳州任职时，释放了大量被典押为奴的百姓']},
5:{title:'从悯农诗人到奢靡宰相',text:'年轻的李绅走在田间，看到农民在烈日下弯腰锄草，汗水一滴滴落入泥土。他深感触动，写下了这首传诵千古的《悯农》。然而命运充满讽刺——李绅后来官至宰相，据《云溪友议》记载，他晚年一顿饭要吃掉数百贯钱，一盘鸡舌就要用三百只鸡。曾经最体恤农民之苦的诗人，最终活成了自己当年批判的人。',trivia:['唐代均田制瓦解后，土地兼并严重，农民生活困苦','李绅的《悯农》共两首，另一首是"春种一粒粟"','他与白居易、元稹同为新乐府运动的参与者']},
6:{title:'苏轼的美食与画评',text:'这首诗是苏轼为好友惠崇的画作题写的。惠崇是北宋著名画僧，擅长画小景山水。苏轼看着画中的竹林、桃花、鸭子和芦芽，不仅看出了画中的春意，还联想到了画面之外的河豚——这恰好暴露了他的"吃货"本色。河豚在江南是极致的美味，也有剧毒。苏轼曾经吃河豚时连连赞叹"也值一死"。',trivia:['惠崇的原画已失传，这首题画诗反而流传千古','河豚每年春天从海中逆流而上到长江产卵','苏轼还发明了东坡肉、东坡豆腐等多道名菜']},
7:{title:'兄弟七年未见的中秋夜',text:'1076年中秋节，苏轼任密州（今山东诸城）太守。他与弟弟苏辙感情极深，但因各自为官，已经整整七年没有见面。那晚苏轼大醉，望着天上的明月，百感交集：他想飞到月宫去，又怕那里太寒冷。最终他悟出"人有悲欢离合，月有阴晴圆缺"的道理，写下"但愿人长久，千里共婵娟"——这份祝愿穿越了近千年，至今仍是中秋节最温暖的表达。',trivia:['苏轼与苏辙是中国文学史上最著名的兄弟','苏轼因反对王安石变法自请外放','这首词被誉为"中秋词自东坡后，余词尽废"']},
8:{title:'乌台诗案的生死劫',text:'1079年，苏轼的政敌从他的诗文中摘取语句，指控他讽刺朝廷新政。这就是著名的"乌台诗案"——乌台是御史台的别称。苏轼被逮捕入狱，在狱中度过了一百三十天，一度做好了赴死的准备，甚至提前给弟弟写了绝命诗。最终在多人营救下免于一死，但被贬到黄州做团练副使。正是这段最黑暗的日子，催生了他最伟大的作品：《念奴娇·赤壁怀古》《赤壁赋》都写于此间。',trivia:['苏轼在狱中曾作诗"是处青山可埋骨，他年夜雨独伤神"','连退休的王安石也为苏轼求情','黄州时期他自称"东坡居士"，自己开荒种地']},
9:{title:'庐山的千面真相',text:'苏轼游庐山时，从不同角度观察这座名山，发现横看是连绵的山岭，侧看是耸立的山峰，远近高低各有不同。他由此悟出：我们之所以看不清事物的真面目，是因为我们自己就身在其中。这个道理既适用于看山，也适用于看人生。有趣的是，这首诗也暗含着苏轼对自己一生宦海沉浮的感悟——当局者迷，旁观者清。',trivia:['庐山是中国最著名的文化名山之一','历代在庐山留下了超过四千首诗词','苏轼游庐山时已被贬至黄州']},
10:{title:'西湖从此有了新名字',text:'苏轼两次在杭州任职，对西湖情有独钟。这首诗将西湖比作美人西施——晴天水光潋滟如同浓妆，雨天山色空蒙如同淡妆，怎么看都美。这个比喻如此精妙，以至于西湖从此有了"西子湖"的别名。苏轼不仅用诗歌美化了西湖，还用实际行动改造了西湖：他疏浚湖泥筑成的苏堤，至今仍是西湖最著名的景观之一。',trivia:['苏堤春晓是西湖十景之首','苏轼在杭州还建了最早的公立医院"安乐坊"','西施是春秋时期越国的美女，生活在约公元前五世纪']},
11:{title:'一场风雨中的人生哲学',text:'某日苏轼与友人外出游玩，归途中突遇大雨。同行的人都手忙脚乱地找地方躲避，唯有苏轼拄着竹杖穿着草鞋，在雨中悠然漫步，还吟啸歌唱。不一会儿雨停了，山头出现了斜阳。苏轼回头看看来时风雨的路，淡然一笑——"也无风雨也无晴"。这首词成为苏轼面对人生风雨的宣言：不论顺逆，心里平静了，外面就没有风雨。',trivia:['写于被贬黄州第三年的沙湖道中','苏轼黄州期间生活困窘，靠自己种地为生','"一蓑烟雨任平生"被视为苏轼的人生座右铭']},
12:{title:'太守的壮志与遗憾',text:'在密州任太守时，苏轼曾带领民众组织了一场大型狩猎。他"左牵黄犬、右擎苍鹰"，率领千骑席卷平岗，场面壮观。但这首词不仅是在写打猎的豪情——"持节云中，何日遣冯唐"用了汉文帝派冯唐赦免魏尚的典故，表达他渴望朝廷重用的心情。当时西夏犯边，苏轼想到的不是自己的升迁，而是保家卫国。',trivia:['苏轼自称这是他"最得意之作"','词中的"孙郎"指三国时少年英雄孙权','天狼星在古代象征外敌入侵']},
13:{title:'十年后的一场梦',text:'苏轼十九岁时娶了十六岁的王弗为妻。王弗聪慧知礼，常在苏轼会客时躲在屏风后面听，事后告诉丈夫哪些人不可信。可惜王弗只活到二十七岁，留下一个年幼的儿子。十年后的一个夜晚，已被贬到密州的苏轼梦见了亡妻。梦中她在小窗前梳妆，一切如同往日。两人四目相对，什么话都说不出来，只有泪水奔涌而下。醒来后苏轼写下了这首词。',trivia:['王弗之父王方曾是苏轼的老师','王弗去世后苏轼再娶王弗的堂妹王闰之','这首词被誉为"千古悼亡词之冠"']},
14:{title:'少年李白的第一次惊叹',text:'725年，二十五岁的李白第一次出蜀，沿长江顺流东下。当他来到庐山，远远看到瀑布从悬崖飞泻而下，整个人被震撼了。日光照射着香炉峰升起的水汽，紫色的烟霭如梦似幻。他觉得这道瀑布不像是人间之物，简直像银河从九重天倾泻下来。"飞流直下三千尺"是年轻李白特有的夸张与浪漫，也是他一生中无数次被山水感动的开始。',trivia:['香炉峰因终年云雾缭绕如博山香炉而得名','庐山瀑布实际落差约155米','这首诗让庐山瀑布成为中国最著名的自然景观之一']},
15:{title:'被赶出朝廷后的酒话',text:'742年李白被召入宫，做了唐玄宗身边的翰林供奉。他以为自己终于可以施展政治抱负了，结果只是被当作御用文人写诗助兴。三年后便被"赐金放还"——说白了就是被客客气气地赶出了朝廷。心灰意冷的李白来到好友丹丘生家中，借酒浇愁。酒桌上他越喝越激动，一句"天生我材必有用"吼了出来——虽然被天下抛弃，他依然相信自己。',trivia:['传说李白曾醉酒让高力士脱靴、杨贵妃研墨','唐玄宗赐金是一种体面的辞退方式','这首诗的另一个名字叫《将进酒》']},
16:{title:'天才少年的短暂人生',text:'王勃六岁能写文章，九岁便敢指出大学者颜师古注解的错误，十六岁就考中了进士。但天才也有莽撞的一面：他因写了一篇《斗鸡赋》得罪了皇帝，被逐出沛王府。后来又因擅杀官奴获罪。二十七岁那年他前往交趾（今越南）探望做县令的父亲，渡海时不幸溺水身亡。在他短暂的一生中，《送杜少府之任蜀州》和《滕王阁序》成为永恒的经典。',trivia:['王勃与杨炯、卢照邻、骆宾王合称"初唐四杰"','《滕王阁序》据说是王勃即兴而作','王勃去世时年仅二十七岁']},
17:{title:'阳关道上最后一杯酒',text:'王维的好友元二要出使安西都护府（今新疆库车）。那是一条漫长而艰险的路——出了阳关就是茫茫戈壁。清晨的细雨打湿了渭城的尘土，客栈旁的柳树经雨后格外青翠。王维端起酒杯，只说了一句："再喝一杯吧，出了阳关就没有老朋友了。"千言万语都融在这一杯酒里。此后这首诗被谱成《阳关三叠》，成为唐代最流行的送别曲。',trivia:['阳关位于今甘肃敦煌西南，是通往西域的必经之路','这首诗又名《渭城曲》','《阳关三叠》至今仍是古琴名曲']},
18:{title:'十七岁的重阳节',text:'王维写这首诗时只有十七岁，独自一人在长安求学。重阳节到了，别人家都热热闹闹地登高、插茱萸，他却独自待在异乡的客栈里。他没有写"我想念家人"，而是写"遥知兄弟登高处，遍插茱萸少一人"——想象哥哥弟弟们在家乡登高，发现少了自己。这个角度的转换是整首诗最动人的地方：思念不是说"我想你"，而是想象"你也在想我"。',trivia:['茱萸是一种有浓烈香气的植物，古人相信能辟邪','重阳节是农历九月初九','王维后来被称为"诗佛"，诗中常有禅意']},
19:{title:'长安城里的至暗时刻',text:'756年，安禄山叛军攻陷长安。杜甫被困城中，目睹帝都的惨状：昔日繁华的长安城杂草丛生，花还在开、鸟还在叫，但看到的人只觉得心碎。战火已持续三个月，一封家书变得比黄金还珍贵——因为不知道家人是否还活着。四十五岁的杜甫头发已白，越搔越少，连簪子都插不住了。这首诗写的不仅是个人之痛，更是一个帝国由盛转衰的缩影。',trivia:['安史之乱是中国历史上最惨烈的内战之一','全国人口从5300万锐减至约1700万','杜甫后来冒死逃出长安投奔唐肃宗']},
20:{title:'生命最后的登高',text:'767年重阳节，五十六岁的杜甫独自登上夔州白帝城附近的高台。此时距他去世只剩三年。他衰老多病、孤身漂泊，国家也在安史之乱后千疮百孔。秋风中万木萧萧落叶，长江滚滚向东奔流。杜甫把一生的苦难浓缩在八句之中，每一句都工整对仗，被后人誉为"古今七律第一"。最后一句"潦倒新停浊酒杯"——连借酒浇愁都做不到了，因为他穷到连酒都喝不起了。',trivia:['此诗八句全部对仗，被称为律诗的典范','杜甫三年后病逝于湘江舟中，享年59岁','夔州即今天的重庆奉节']},
21:{title:'溪水为何向西流',text:'被贬黄州的苏轼有一天去蕲水清泉寺游玩，发现寺前兰溪的水竟然是向西流的。在古人看来，"百川东到海"是天经地义的事，溪水西流是罕见的自然现象。苏轼由此生发感慨：谁说人生不能重新年轻呢？连水都可以倒着流！不要因为头发白了就唉声叹气——他把一个小小的地理发现，变成了对抗衰老和命运的宣言。',trivia:['蕲水清泉寺位于今湖北浠水县','苏轼在黄州期间自号"东坡居士"','"休将白发唱黄鸡"中黄鸡指打鸣报时，比喻时光流逝']},
22:{title:'月夜泛舟赤壁',text:'1082年七月十六日，被贬黄州的苏轼与友人乘小船在赤壁矶下游览。明月升起，清风徐来，水波不兴。他们饮酒诵诗，欣赏月下江景。苏轼在文中探讨了人生的短暂与永恒：从变化的角度看，天地一刻也不停息；但从不变的角度看，万物与我都是永恒的。这种通达的思考，帮助他在人生最低谷找到了内心的平静。',trivia:['苏轼前后两次游赤壁，写下前后《赤壁赋》','黄州赤壁并非三国赤壁之战的古战场','这是中国散文史上最优美的篇章之一']},
23:{title:'墙里墙外的缘分',text:'苏轼晚年被贬到惠州，一天在路上走着，忽然听到墙里传来荡秋千的笑声。他驻足倾听，笑声渐渐远去，那个看不见的女子也消失了。"多情却被无情恼"——他有意倾听，人家却无意理会。这个小场景其实是苏轼人生的隐喻：他多情地热爱这个世界，而这个世界总是对他无情。但他并不绝望，因为"天涯何处无芳草"。',trivia:['苏轼被贬惠州后还被贬到更远的海南儋州','据说"天涯何处无芳草"是侍妾朝云最爱唱的词句','朝云唱到此句时总是泪如雨下']},
24:{title:'青年杜甫的壮志凌云',text:'这是杜甫早年的作品，写于他漫游齐鲁、登临泰山的时候。此时的杜甫二十多岁，意气风发，还没有经历人生的挫折与磨难。他仰望泰山，豪情万丈地喊出"会当凌绝顶，一览众山小"。这与后来写《登高》《春望》时的沉郁苍凉判若两人。从《望岳》到《登高》，我们可以看到一个人从意气风发到饱经沧桑的完整人生。',trivia:['泰山高1545米，是五岳之首','古代帝王常到泰山举行封禅大典','杜甫此次泰山之行正值科举落第之后']},
25:{title:'烟花三月的告别',text:'李白与孟浩然相识后，对这位前辈诗人极为仰慕。一年春天，孟浩然要从黄鹤楼顺江东下去扬州。李白在江边送别，目送孟浩然的船帆渐渐消失在碧空的尽头，只剩下长江水滔滔东流。全诗没有一句直接写离愁，却用"孤帆远影"和"长江天际"两个画面写尽了深情。最好的送别，不是声嘶力竭地挽留，而是静静地目送。',trivia:['黄鹤楼位于今湖北武汉','唐代的扬州是全国最繁华的城市之一','李白比孟浩然小十二岁']},
26:{title:'从死囚到自由人',text:'李白晚年因参与永王李璘的军事行动被朝廷定罪，流放夜郎（今贵州桐梓）。这对五十七岁的他来说几乎是死刑——夜郎路远，老人能不能活着走到都是问题。然而行至白帝城时，忽然传来朝廷大赦的消息！李白欣喜若狂，立刻掉转船头顺江东下。三峡的水流湍急如箭，小船飞速穿过万重山。"轻舟已过万重山"的"轻"字，是心情的轻松，也是劫后余生的庆幸。',trivia:['白帝城位于今重庆奉节县','从白帝城到江陵约1200里，顺流一日可到','李白遇赦后两年便去世了']},
27:{title:'边塞上的最后一杯酒',text:'盛唐时期，唐朝与西域各民族交流频繁。葡萄酒、夜光杯都是通过丝绸之路从西域传入的。边塞将士们在出征前最后的夜宴上，用夜光杯斟满葡萄酒痛饮。正要举杯，马上的琵琶已经催促出发了。"醉卧沙场君莫笑"——笑什么呢？自古以来出征打仗能有几个人活着回来？与其忧心忡忡，不如痛痛快快喝一场。这首诗写出了盛唐将士独有的豪气与悲壮。',trivia:['夜光杯产自甘肃酒泉，用祁连山玉雕琢而成','葡萄酒在唐代是珍贵的西域进口饮品','边塞诗是唐诗中独特而重要的一类']},
28:{title:'一千年的边患',text:'王昌龄在这首诗中把时间拉回了秦汉——"秦时明月汉时关"不是说秦朝的月亮、汉朝的关隘，而是说这轮明月从秦汉照到现在，这些关隘从秦汉守到现在，边患已经持续了上千年。万里出征的将士们至今不能回来。他提到了"飞将军"李广——汉代最能打的边将，匈奴闻名丧胆。言外之意是：如果朝廷能用对人，何至于此？含蓄中暗藏着对用人不当的批评。',trivia:['李广是西汉名将，匈奴称之为"飞将军"','王昌龄被称为"七绝圣手"','阴山是中国北方重要的地理分界线']},
29:{title:'从帝王到阶下囚',text:'李煜在位时不理朝政，沉迷于诗词音律和宴饮。975年宋军攻破金陵，李煜肉袒出降，被押送到汴京。从此他从锦衣玉食的帝王变成了受尽屈辱的阶下囚。夜里他独自登上西楼，看到弯弯的月亮如钩，深院中的梧桐在秋风中瑟瑟发抖。亡国之愁"剪不断、理还乱"——他想理清这些愁绪，却越理越乱。那种滋味，只有他自己知道。',trivia:['南唐是五代十国中文化最繁荣的政权之一','李煜精通诗词、书法、绘画和音律','他在位期间南唐国力日衰，最终亡于宋朝']},
30:{title:'一首词换来一杯毒酒',text:'被俘三年后的七月七日，是李煜四十二岁生日。他在囚禁之所写下了这首《虞美人》，命歌妓在生日宴上演唱。"问君能有几多愁？恰似一江春水向东流"——用滚滚东流的江水来比喻无穷无尽的愁恨。这首词传到了宋太宗耳中，太宗大怒：你还在怀念故国？随即赐牵机药将李煜毒杀。牵机药是一种可怕的毒药，服后全身抽搐，头脚相接如牵机状。李煜用生命写就了最后的词篇。',trivia:['牵机药可能是马钱子碱','李煜被毒杀于978年七月七日，恰好是七夕','王国维评李煜"变伶工之词而为士大夫之词"']},
31:{title:'少女时代的快乐时光',text:'这首词记录的是李清照少女时代的一次郊游。一个夏日黄昏，她和女伴们在溪亭饮酒赏景，喝得酩酊大醉，连回家的路都忘了。天色已晚，她慌慌张张地划船往回走，结果一不小心闯进了荷花丛深处。急着划啊划，结果惊飞了一群正在栖息的鸥鹭，水花四溅、鸟声一片。这个充满生机和趣味的画面，是李清照一生中最无忧无虑的时光。',trivia:['李清照出身书香门第，父亲是苏轼的学生','她少年时就以词名闻天下','这首词被认为是写少女生活最灵动的作品之一']},
32:{title:'国破家亡后的凄凉',text:'靖康之变后，北宋灭亡。李清照随丈夫赵明诚仓皇南逃，途中大部分收藏的金石书画都丢失了。不久赵明诚病逝，李清照孤身一人漂泊江南。她从一个富裕幸福的贵妇人变成了孤苦伶仃的寡妇。这首词开篇"寻寻觅觅，冷冷清清，凄凄惨惨戚戚"连用十四个叠字，营造出无比凄凉的氛围——她在寻找什么？也许是丢失的收藏，也许是逝去的爱人，也许是再也回不去的从前。',trivia:['靖康之变发生于1127年，金兵攻破汴京','赵明诚去世后，李清照曾再嫁又离婚','她晚年孤苦无依，连确切的卒年都不详']},
33:{title:'挑灯看剑的老将军',text:'辛弃疾二十一岁时曾率五十人闯入数万金兵大营，活捉叛徒张安国，千里南归，一战成名。然而南归后他却被闲置了大半生，满腔热血无处施展。深夜醉酒后他挑亮灯火端详宝剑，梦中回到了号角连天的军营：烤肉分给将士、军乐奏响战歌、战马飞驰、弓弦震响……他梦见自己完成了收复中原的大业。然而最后三个字"白发生"急转直下——梦醒了，一切都是空想。',trivia:['辛弃疾年轻时的壮举在《宋史》中有明确记载','他一生写词六百余首，数量为宋词之冠','"了却君王天下事"至死未能实现']},
34:{title:'灯火阑珊处的清醒者',text:'元宵节之夜，满城灯火如花树怒放，焰火如星雨坠落。宝马香车络绎不绝，箫声悠扬，鱼龙花灯舞了一整夜。盛装的女子们笑语盈盈，暗香浮动。在这繁华热闹中，诗人却在寻找另一个人。找了千百遍，猛然回头，发现那人静静地站在灯火零落的地方。辛弃疾以此自喻——在举国歌舞升平的南宋，他是那个独自忧国、不愿随波逐流的清醒者。',trivia:['王国维在《人间词话》中将此词视为治学第三境界','元宵节是古代难得的女性可以外出的节日','辛弃疾写此词时已被闲置不用']},
35:{title:'精忠报国的悲歌',text:'岳飞出身农家，少时母亲在他背上刺下"精忠报国"四字。他从一名普通士兵成长为统帅，率领岳家军北伐，连克郾城、颍昌等重镇，直逼金国腹地。士兵们士气高涨高呼"直捣黄龙"，收复中原指日可待。然而宋高宗和秦桧一心求和，连下十二道金牌召回岳飞。不久岳飞被以"莫须有"（也许有）的罪名杀害于临安风波亭，年仅三十九岁。"莫等闲、白了少年头"成为对所有年轻人的警醒。',trivia:['岳飞的孙子岳珂后来为他整理了遗文','秦桧夫妇跪像至今仍在岳飞墓前','岳飞被害后二十年，宋孝宗为其平反']},
36:{title:'西湖早春的精确记录',text:'白居易在杭州做刺史时，经常骑马到西湖边游览。这首诗精确记录了早春的微妙时刻：不是盛春的万紫千红，而是春天刚刚到来时的第一缕生机。黄莺是"早莺"——最先来报春的几只；燕子是"新燕"——今年第一次来筑巢的；花还只是"渐欲"迷眼——还没有完全开放；草也只是"才能"没过马蹄——刚刚冒出头来。每一个词都卡在"刚好"的位置上。',trivia:['白居易在杭州修建了白堤','白堤至今仍是西湖最著名的景观','白居易主张"文章合为时而著，歌诗合为事而作"']},
37:{title:'马嵬坡上的帝王之泪',text:'唐玄宗李隆基与杨贵妃的爱情是中国历史上最著名的爱情悲剧。安史之乱爆发后，唐玄宗携杨贵妃仓皇逃往四川。行至马嵬坡时，随行禁军哗变，要求处死杨贵妃。唐玄宗被迫赐三尺白绫，杨贵妃含泪自缢。从此唐玄宗日日思念，白居易用"在天愿作比翼鸟，在地愿为连理枝"写出了这份刻骨的爱恨。但"天长地久有时尽"——再深的感情也无法改变命运。',trivia:['杨贵妃原名杨玉环，本是唐玄宗儿子寿王的妃子','《长恨歌》全诗共120句840字','马嵬坡在今陕西兴平市']},
38:{title:'浔阳江头的偶遇',text:'白居易被贬为江州司马后，一个秋夜在浔阳江头送客。忽然听到水面上传来琵琶声，循声找去，发现弹琴的是一位年老的琵琶女。她年轻时是长安的名伎，技艺高超，追捧者无数。但年华老去后嫁给了一个商人，丈夫常年在外经商。白居易听完她的身世泣不成声——他自己又何尝不是？从京城的高官到江州的小官，人生的落差何其相似。"同是天涯沦落人"成为一切失意人的共鸣。',trivia:['江州即今天的江西九江','白居易听完琵琶曲后"青衫湿"——泪湿了官服','《琵琶行》是中国古代叙事诗的杰作']},
39:{title:'从美酒佳肴到拔剑茫然',text:'被唐玄宗赐金放还后的李白心灰意冷。朋友设宴为他饯行，金杯美酒、玉盘珍馐摆满了桌子。但李白拿起筷子又放下，端起酒杯又搁下——满桌子的山珍海味他一口也吃不下去。他拔出宝剑环顾四周，心中一片茫然。前方的路被冰雪堵死了，该怎么走？就在极度绝望中，他突然振作起来："长风破浪会有时！"这个从绝望到希望的巨大反转，正是李白式的浪漫。',trivia:['此诗共三首，最后一首以"行路难"为叹','李白此时约四十二岁','"长风破浪"典出南朝宗悫"愿乘长风破万里浪"']},
40:{title:'初出蜀地的震撼',text:'二十五岁的李白第一次离开四川，乘舟沿长江东下。当船行至天门山时，他被眼前的景象震撼了：两座青山如同大门一样夹江对峙，长江从中劈开奔涌而过。碧绿的江水到了这里突然回旋。他把自己乘坐的小船写成"孤帆一片日边来"——从太阳旁边驶来，何等壮丽！这首诗洋溢着年轻李白的朝气与浪漫，充满了对未知世界的好奇与期待。',trivia:['天门山位于安徽当涂，东为博望山，西为梁山','长江在天门山处江面骤然变窄','李白后来定居于当涂，并最终病逝于此']},
41:{title:'燕子不知道的沧桑',text:'东晋时期乌衣巷是最繁华的贵族居住区，王导和谢安两大家族的府邸都在这里。当时的乌衣巷车马喧嚣、冠盖如云。然而几百年过去，刘禹锡来到这里时，朱雀桥边长满了野草，乌衣巷口只剩斜阳映照。最妙的是最后两句：当年在王家、谢家大堂前筑巢的燕子，如今飞进了普通百姓的家中。燕子不知道世事变迁，依旧年年来去——但物是人非，已经换了人间。',trivia:['王导是东晋开国元勋，谢安曾指挥淝水之战','乌衣巷位于今南京秦淮河畔','刘禹锡被贬二十三年后路过金陵写下此诗']},
42:{title:'东边日出西边雨的爱情',text:'刘禹锡被贬巴蜀期间，深受当地民歌启发，创作了多首竹枝词。这首写的是一个少女在江边听到心上人唱歌时的微妙心情：是爱我还是不爱我呢？就像天气一样——东边出太阳、西边下着雨，说它晴吧又不全晴，说它不晴吧又有些晴。"晴"和"情"谐音，写出了恋爱中那种忽喜忽忧、患得患失的心理，是中国最早、最精彩的谐音双关情诗。',trivia:['竹枝词源于巴蜀地区的民歌','刘禹锡一共写了十一首竹枝词','这种以谐音表达情感的手法至今仍在民间流行']},
43:{title:'一首诗让一座寺庙名扬天下',text:'张继进士落第后，郁郁不得志，乘船经过苏州。那个深秋的夜晚月亮落下去了，乌鸦在叫，满天寒霜。江边的渔火映着枫树，他怀着满腹愁思难以入眠。就在半梦半醒之间，姑苏城外寒山寺的钟声悠悠传来，一声一声敲在心上。张继提笔写下这首诗，自己可能并不知道，这首诗将让一座普通的小寺庙名扬天下千余年。至今每年除夕，数万人聚集在寒山寺听新年钟声。',trivia:['寒山寺因唐代高僧寒山而得名','日本人对这首诗极为推崇','张继落第后继续参加科考，后来终于考中']},
44:{title:'被孩子叫"客人"的心酸',text:'贺知章八十六岁辞官回乡，唐玄宗亲自为他饯行，太子率百官相送，极尽荣耀。然而当他回到阔别五十多年的故乡时，一切都变了。他说的还是家乡话，但头发已经稀疏花白。村里的孩子们看到他，以为是外来的客人，笑嘻嘻地问："客人，你从哪里来呀？"——在自己的家乡被当作客人，这可能是人生中最微妙也最心酸的时刻了。',trivia:['贺知章在朝为官五十年，历经五朝皇帝','他回乡后不久便去世了','他是李白的伯乐，称李白为"谪仙人"']},
45:{title:'题在旅店墙上的怒火',text:'北宋灭亡后，南宋朝廷逃到杭州（当时叫临安），不思收复北方失地，反而沉迷于杭州的繁华。西湖边歌舞升平、纸醉金迷，权贵们把杭州当作了太平盛世的汴京。林升路过一家旅店，看到窗外的繁华景象，怒不可遏，提笔在旅店的墙壁上写下了这首诗。"暖风熏得游人醉"——这暖风不仅是自然的春风，更是令人沉沦的安逸之风。这首题壁诗一传十、十传百，很快传遍了临安城。',trivia:['汴州即今天的河南开封，是北宋首都','南宋在杭州偏安了152年','题壁诗在古代是一种重要的诗歌传播方式']},
46:{title:'至死不渝的遗愿',text:'陆游一生主张抗金北伐，但始终被主和派打压。他在前线写过"楼船夜雪瓜洲渡，铁马秋风大散关"的壮烈诗篇，也在田园写过"小楼一夜听春雨，深巷明朝卖杏花"的温柔文字。1210年，八十五岁的陆游卧病在床，知道自己时日无多。弥留之际他把儿子叫到床前，留下最后的嘱咐：我死了什么都不在乎，只遗憾看不到国家统一。等到王师北定中原的那一天，祭祀的时候别忘了告诉我一声。',trivia:['陆游一生写诗近一万首','他与唐琬的爱情悲剧写在《钗头凤》中','陆游去世时南宋已偏安八十三年']},
47:{title:'山穷水尽后的柳暗花明',text:'陆游被罢官后回到家乡山阴。一天他在乡间行走，走过了一座又一座山，越过了一条又一条溪，觉得已经无路可走了。忽然转过一个弯，眼前出现了柳树成荫、繁花似锦的村庄。农民们热情地招待他，浊酒粗茶却别有风味。这个在现实中的体验后来被提炼为哲理名句："山重水复疑无路，柳暗花明又一村。"它告诉我们在绝望之时不要放弃，转机往往就在下一步。',trivia:['山阴即今天的浙江绍兴','这首诗写于陆游被免官回乡时期','"柳暗花明"成为中国人最常用的成语之一']},
48:{title:'不屈的丞相',text:'1278年文天祥在广东兵败被俘，元军押他经过零丁洋（今广东珠海附近海域）。元帅张弘范逼他写信招降南宋残余势力，文天祥提笔写下了这首诗作为回答。"人生自古谁无死？留取丹心照汗青"——他用诗歌表明了宁死不降的决心。之后他被押送到大都（今北京），元朝开出了极其优厚的条件劝降：只要归顺，官至宰相。文天祥不为所动，在阴暗潮湿的土牢中度过了三年，最终从容就义。',trivia:['文天祥二十岁中状元','他在狱中写下了著名的《正气歌》','文天祥祠位于今北京市东城区']},
49:{title:'辞官路上的落花',text:'1839年，龚自珍辞去官职离开北京。他已经看透了这个腐朽的朝廷——鸦片泛滥、官场腐败、危机四伏——但他的改革建议无人采纳。离京的路上他写下了315首诗，记录了一路上的所思所感。其中最著名的就是这一首。"落红不是无情物，化作春泥更护花"——花瓣落下并不是结束，它化为泥土滋养新的生命。龚自珍用这个比喻暗示：虽然离开了朝廷，他仍然会以另一种方式为国家效力。',trivia:['龚自珍辞官两年后便暴卒，年仅五十岁','他是最早主张禁止鸦片的思想家之一','《己亥杂诗》共315首，是中国诗歌史上最大的组诗之一']},
50:{title:'二十年的物是人非',text:'陈与义年轻时在洛阳过着诗酒流连的生活。午桥上与朋友们饮酒，月光倒映在长沟的流水中无声而过，杏花疏影里有人吹笛一直到天亮——那是多么美好的时光。然而靖康之变打碎了一切。二十多年后，他登上小阁回望，昔日的朋友们要么死去、要么离散。"二十余年如一梦"——从太平盛世到国破家亡，如同做了一场大梦。而"古今多少事"最终都消融在三更的渔歌声中。',trivia:['靖康之变是中国历史上最惨烈的国难之一','陈与义一路南逃，辗转流离多年','这首词是中国词史上写"怀旧"的经典之作']}

function getToday(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function getTodayPoem(){
  const learned=getData('learned');
  // 读取持久化的"当前学习指针"
  let cursorId=null;
  try{cursorId=JSON.parse(localStorage.getItem('poem_cursor'))}catch(e){}
  // 起始基准：首次使用时按日期定一个起点，之后就不再随日期漂移
  const d=new Date();
  const baseIdx=Math.floor((d.getTime()/86400000))%POEMS.length;
  // 如果指针存在且指向的诗未学，直接返回它（跨天不变）
  if(cursorId!=null){
    const cur=POEMS.find(p=>p.id===cursorId);
    if(cur&&!learned[cur.id]) return cur;
  }
  // 否则（首次使用 或 指针指向的诗已被打卡），从基准或指针位置找下一首未学的，并保存新指针
  const startIdx=cursorId!=null
    ? (POEMS.findIndex(p=>p.id===cursorId)+1)   // 已打卡，推进到下一首
    : baseIdx;                                   // 首次使用
  for(let i=0;i<POEMS.length;i++){
    const poem=POEMS[((startIdx<0?0:startIdx)+i)%POEMS.length];
    if(!learned[poem.id]){
      localStorage.setItem('poem_cursor',JSON.stringify(poem.id));
      return poem;
    }
  }
  // 如果全部学完，回到基准诗词
  return POEMS[baseIdx];
}
function getData(k){try{return JSON.parse(localStorage.getItem('poem_'+k))||{}}catch(e){return{}}}
function setData(k,v){localStorage.setItem('poem_'+k,JSON.stringify(v))}

// 学习记录
function markLearned(id){const r=getData('learned');r[id]=getToday();setData('learned',r);trackDay()}
function getScores(){return getData('scores')}
function addScore(id,score,total){const s=getData('scores');if(!s[id])s[id]=[];s[id].push({score,total,date:getToday()});setData('scores',s);trackDay()}

// 每日活跃追踪
function trackDay(){const d=getData('days');d[getToday()]=true;setData('days',d)}
function getDays(){return getData('days')}

function addWrong(poemId,question,yourAnswer,correctAnswer){
const w=getData('wrongs');
const key=poemId+'_'+question.slice(0,20);
w[key]={poemId,question,yourAnswer,correctAnswer,date:getToday()};
setData('wrongs',w);
}

// 连续天数计算
function getStreak(){
const days=getDays();
const dates=Object.keys(days).sort().reverse();
if(!dates.length)return 0;
let streak=0;
const today=new Date();
for(let i=0;i<400;i++){
  const d=new Date(today);
  d.setDate(d.getDate()-i);
  const key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  if(days[key])streak++;
  else if(i>0)break; // 允许今天还没打卡
  else continue;
}
return streak;
}

const ranks=[

  {name:'诗生',icon:'🌓',desc:'勤学不辍，渐入佳境',min:5,color:'#7a9fa0'},
  {name:'诗士',icon:'🌔',desc:'腹有诗书，气自华生',min:12,color:'#4a7c59'},
  {name:'诗客',icon:'🌕',desc:'诗情画意，信手拈来',min:20,color:'#2F4F4F'},
  {name:'诗豪',icon:'✨',desc:'才华横溢，诗酒趁年华',min:30,color:'#8B6914'},
  {name:'诗仙',icon:'🏆',desc:'已臻化境，与古人神交',min:42,color:'#C0483C'},
];
let current=ranks[0],next=ranks[1];
for(let i=ranks.length-1;i>=0;i--){
  if(learnedCount>=ranks[i].min){current=ranks[i];next=ranks[i+1]||null;break}
}
return {current,next,learnedCount};
}

// 打卡按钮：短按打卡（仅未打卡时），长按撤销（仅已打卡时）
function bindCheckinButton(id,isLearned){
const btn=document.getElementById('checkinBtn');
if(!btn)return;
let pressTimer=null;
let longPressed=false;

const startPress=(e)=>{
  longPressed=false;
  if(isLearned){
    // 已打卡：启动长按计时器，600ms 后触发撤销
    pressTimer=setTimeout(()=>{
      longPressed=true;
      if(navigator.vibrate)navigator.vibrate(30);
      undoCheckin(id);
    },600);
  }
};
const cancelPress=()=>{
  if(pressTimer){clearTimeout(pressTimer);pressTimer=null}
};
const handleClick=(e)=>{
  if(longPressed){e.preventDefault();return}
  if(!isLearned){doCheckin(id)}
  // 已打卡状态下的短按：什么都不做（引导用户去长按）
};

btn.addEventListener('mousedown',startPress);
btn.addEventListener('touchstart',startPress,{passive:true});
btn.addEventListener('mouseup',cancelPress);
btn.addEventListener('mouseleave',cancelPress);
btn.addEventListener('touchend',cancelPress);
btn.addEventListener('touchcancel',cancelPress);
btn.addEventListener('click',handleClick);
}

function doCheckin(id){
markLearned(id);
const btn=document.getElementById('checkinBtn');
if(btn){btn.style.transform='scale(0.96)';setTimeout(()=>{btn.style.transform='scale(1)'},200)}
// 打卡后自动跳到下一首未学诗词
setTimeout(()=>{
  curPoem=getTodayPoem();
  quizState.questions=[];
  renderPoem();
},600);
}

function undoCheckin(id){
const r=getData('learned');
delete r[id];
setData('learned',r);
// 撤销打卡时，把指针退回到这首诗，下次进入仍显示它
localStorage.setItem('poem_cursor',JSON.stringify(id));
curPoem=POEMS.find(p=>p.id===id)||curPoem;
renderPoem();
}

function generateQuiz(){
const p=curPoem;const qs=[];
// 1.填空题：去掉一句让填
const lines=p.content.flatMap(l=>l.replace(/[，。？！]/g,'|').split('|').filter(s=>s.trim()));
if(lines.length>=2){
const ri=Math.floor(Math.random()*lines.length);
qs.push({type:'fill',q:`请补全诗句中缺少的部分：\n${lines.map((l,i)=>i===ri?'＿＿＿＿＿＿':l).join('，')}`,answer:lines[ri]});
}
// 2.选择题：作者
const others=POEMS.filter(x=>x.id!==p.id).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.author);
const opts=[p.author,...others].filter((v,i,a)=>a.indexOf(v)===i);
while(opts.length<4)opts.push(['杜甫','白居易','王维','李商隐','杜牧','陆游','辛弃疾'].find(x=>!opts.includes(x)));
opts.sort(()=>Math.random()-.5);
qs.push({type:'choice',q:`《${p.title}》的作者是谁？`,options:opts,answer:p.author});
// 3.选择题：朝代
const dOpts=['唐','宋','元','明'].sort(()=>Math.random()-.5);
qs.push({type:'choice',q:`《${p.title}》是哪个朝代的作品？`,options:dOpts,answer:p.dynasty});
// 4.默写题
if(lines.length>=2){
const ri2=Math.floor(Math.random()*(lines.length-1));
qs.push({type:'write',q:`请默写「${lines[ri2]}」的下一句：`,answer:lines[ri2+1]});
}
return qs;
}

function checkChoice(el,picked,answer){
document.querySelectorAll('.quiz-opt').forEach(b=>{b.classList.add('disabled');if(b.textContent===answer)b.classList.add('correct')});
if(picked!==answer){el.classList.add('wrong');addWrong(curPoem.id,quizState.questions[quizState.current].q,picked,answer)}
const ok=picked===answer;
if(ok)quizState.score++;
document.getElementById('qResult').innerHTML=`<div class="quiz-result ${ok?'correct':'wrong'}">${ok?'✓ 回答正确！':'✗ 正确答案：'+answer}</div>
<button class="quiz-btn" onclick="quizState.current++;renderCurrentQ()">下一题</button>`;
}
// 答案规范化：去标点、去空白
function normalizeAnswer(s){return s.replace(/[，。？！、；：""''「」《》,.\?!;:\s]/g,'')}

// Levenshtein 距离
function levenshtein(a,b){
  if(!a.length)return b.length;
  if(!b.length)return a.length;
  const m=[];
  for(let i=0;i<=b.length;i++)m[i]=[i];
  for(let j=0;j<=a.length;j++)m[0][j]=j;
  for(let i=1;i<=b.length;i++){
    for(let j=1;j<=a.length;j++){
      if(b.charAt(i-1)===a.charAt(j-1))m[i][j]=m[i-1][j-1];
      else m[i][j]=Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1);
    }
  }
  return m[b.length][a.length];
}

// 判断答案：完全一致 / 近似（相似度>=80%）/ 错误
// 返回 {correct:bool, exact:bool, similarity:0-1}
function judgeAnswer(userInput,correctAnswer){
  const u=normalizeAnswer(userInput);
  const c=normalizeAnswer(correctAnswer);
  if(!u)return {correct:false,exact:false,similarity:0};
  if(u===c)return {correct:true,exact:true,similarity:1};
  const dist=levenshtein(u,c);
  const sim=1-dist/Math.max(u.length,c.length);
  return {correct:sim>=0.8,exact:false,similarity:sim};
}

function checkFill(){
const v=document.getElementById('fillInput').value.trim();
const ans=quizState.questions[quizState.current].answer;
const r=judgeAnswer(v,ans);
if(r.correct)quizState.score++;
else addWrong(curPoem.id,quizState.questions[quizState.current].q,v||'(未作答)',ans);
let msg;
if(r.exact)msg='✓ 回答正确！';
else if(r.correct)msg='✓ 基本正确！标准答案：'+ans;
else msg='✗ 正确答案：'+ans;
document.getElementById('qResult').innerHTML=`<div class="quiz-result ${r.correct?'correct':'wrong'}">${msg}</div>
<button class="quiz-btn" onclick="quizState.current++;renderCurrentQ()">下一题</button>`;
}

function exportData(){
  const data={
    version:1,
    exportedAt:new Date().toISOString(),
    learned:getData('learned'),
    scores:getData('scores'),
    days:getData('days'),
    wrongs:getData('wrongs')
  };
  return JSON.stringify(data);
}

function importData(jsonStr){
  let data;
  try{data=JSON.parse(jsonStr)}
  catch(e){return {ok:false,msg:'数据格式无效，请检查是否复制完整'}}
  if(!data||typeof data!=='object')return {ok:false,msg:'数据格式无效'};
  // 宽松校验：有任意一个已知字段就算数
  if(!('learned' in data)&&!('scores' in data)&&!('days' in data)&&!('wrongs' in data)){
    return {ok:false,msg:'这段数据里没有可识别的学习记录'};
  }
  if(data.learned)setData('learned',data.learned);
  if(data.scores)setData('scores',data.scores);
  if(data.days)setData('days',data.days);
  if(data.wrongs)setData('wrongs',data.wrongs);
  return {ok:true};
}

// 把一首诗拆成单句（按中文标点切，保留原始含标点的形式用于展示，去标点版用于匹配）
function splitPoemLines(poem){
  const all=poem.content.join('');
  return all.split(/[，。？！、；：]/).map(s=>s.trim()).filter(s=>s.length>=2);
}

// 从已学诗里统计可出字：出现在 ≥3 个不同句子里的字才收录
function getFhlCharPool(){
  const learned=getData('learned');
  const learnedIds=Object.keys(learned).map(Number);
  const learnedPoems=POEMS.filter(p=>learnedIds.includes(p.id));
  // 每个字 -> 包含它的句子集合（Set，按"诗id|句index"去重）
  const charMap={};
  learnedPoems.forEach(p=>{
    const lines=splitPoemLines(p);
    lines.forEach((line,idx)=>{
      // 该句涉及的去重字符
      const uniqueChars=[...new Set(line.split(''))];
      uniqueChars.forEach(ch=>{
        if(!/[\u4e00-\u9fa5]/.test(ch))return; // 只收中文字
        if(!charMap[ch])charMap[ch]=[];
        charMap[ch].push({poemId:p.id,poemTitle:p.title,author:p.author,lineIdx:idx,line});
      });
    });
  });
  // 只保留出现在 ≥3 句的字
  const pool={};
  Object.entries(charMap).forEach(([ch,arr])=>{
    if(arr.length>=3)pool[ch]=arr;
  });
  return pool;
}

// 飞花令状态
let fhlState={
  targetChar:'',
  allMatches:[], // 该字在已学诗中的所有匹配句（供判对和结算）
  answered:[],   // 用户已答对的句子（去标点形式）
  attemptsLeft:3,
  passed:false,
  finished:false
};

function openFeihualing(){
  const pool=getFhlCharPool();
  const chars=Object.keys(pool);
  if(!chars.length){
    alert('暂无可用字，请再多学几首诗');
    return;
  }
  // 随机挑一个字，尽量避开刚刚用过的（简单做法：随机）
  const targetChar=chars[Math.floor(Math.random()*chars.length)];
  fhlState={
    targetChar,
    allMatches:pool[targetChar],
    answered:[],
    attemptsLeft:3,
    passed:false,
    finished:false
  };
  showFhlDialog();
}

function showFhlDialog(){
  const s=fhlState;
  const total=s.allMatches.length;
  const answeredCount=s.answered.length;
  const goal=3;
  const progressPct=Math.min(100,Math.round(answeredCount/goal*100));

  let bodyHtml;
  if(s.finished){
    // 结算页
    const missed=s.allMatches.filter(m=>!s.answered.includes(normalizeAnswer(m.line)));
    // 去重：同一句诗可能被多次收录（不同字也能匹配），这里按 line 去重
    const seen=new Set();
    const missedUnique=missed.filter(m=>{if(seen.has(m.line))return false;seen.add(m.line);return true});

    bodyHtml=`
    <div style="text-align:center;padding:6px 0 16px">
      <div style="font-size:44px;margin-bottom:6px">${s.passed?'🎉':'📖'}</div>
      <div style="font-family:'ZCOOL XiaoWei',serif;font-size:20px;color:${s.passed?'var(--red)':'var(--gray)'};letter-spacing:3px">
        ${s.passed?'飞花令通关':'未能凑齐三句'}
      </div>
      <div style="font-size:12px;color:var(--gray);margin-top:6px">以「${s.targetChar}」字共对出 ${answeredCount} 句</div>
    </div>

    ${s.answered.length?`
    <div style="font-size:12px;color:var(--gray);margin-bottom:6px;letter-spacing:1px">你说出的</div>
    <div style="background:rgba(160,53,42,0.04);border-left:3px solid var(--red);padding:10px 12px;border-radius:0 8px 8px 0;margin-bottom:14px">
      ${s.answered.map(a=>{
        const m=s.allMatches.find(x=>normalizeAnswer(x.line)===a);
        return `<div style="font-size:14px;line-height:2;color:var(--ink)">${m?m.line:a}<span style="font-size:11px;color:var(--gray);margin-left:8px">——《${m?m.poemTitle:'?'}》</span></div>`;
      }).join('')}
    </div>`:''}

    ${missedUnique.length?`
    <div style="font-size:12px;color:var(--gray);margin-bottom:6px;letter-spacing:1px">还有这些你没说到</div>
    <div style="background:rgba(47,79,79,0.03);border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 8px 8px 0;margin-bottom:14px;max-height:200px;overflow-y:auto">
      ${missedUnique.slice(0,15).map(m=>`<div style="font-size:13px;line-height:2;color:#4a4035">${m.line}<span style="font-size:11px;color:var(--gray);margin-left:8px">——《${m.poemTitle}》</span></div>`).join('')}
    </div>`:''}

    <div style="display:flex;gap:8px">
      <button onclick="openFeihualing()" style="flex:1;padding:11px;border:none;border-radius:8px;background:var(--red);color:#fff;font-family:'Noto Serif SC',serif;font-size:13px;cursor:pointer">换一个字</button>
      <button onclick="closeDialog()" style="padding:11px 20px;border:1px solid var(--light);border-radius:8px;background:transparent;color:var(--gray);font-family:'Noto Serif SC',serif;font-size:13px;cursor:pointer">返回</button>
    </div>`;
  }else{
    // 对诗页
    bodyHtml=`
    <div style="text-align:center;margin-bottom:14px">
      <div style="font-size:11px;color:var(--gray);letter-spacing:3px">请说一句带有</div>
      <div style="font-family:'ZCOOL XiaoWei',serif;font-size:56px;color:var(--red);margin:6px 0;text-shadow:0 2px 10px rgba(160,53,42,0.15)">${s.targetChar}</div>
      <div style="font-size:11px;color:var(--gray);letter-spacing:3px">字的诗句</div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:11px;color:var(--gray)">
      <span>已对 ${answeredCount} / 3 句</span>
      <span>机会剩 ${'●'.repeat(s.attemptsLeft)}${'○'.repeat(3-s.attemptsLeft)}</span>
    </div>
    <div style="height:4px;background:var(--light);border-radius:2px;overflow:hidden;margin-bottom:14px">
      <div style="height:100%;width:${progressPct}%;background:var(--red);transition:width .3s"></div>
    </div>

    ${s.answered.length?`<div style="background:rgba(160,53,42,0.04);border-radius:8px;padding:8px 10px;margin-bottom:12px;font-size:12px;line-height:1.9;color:#4a4035">
      ${s.answered.map(a=>{const m=s.allMatches.find(x=>normalizeAnswer(x.line)===a);return '✓ '+(m?m.line:a);}).join('<br>')}
    </div>`:''}

    <input id="fhlInput" placeholder="写一句带「${s.targetChar}」的诗..." style="width:100%;padding:11px 12px;border:1px solid var(--light);border-radius:8px;font-size:15px;font-family:'Noto Serif SC',serif;background:#fff;outline:none;margin-bottom:6px" onkeydown="if(event.key==='Enter')fhlSubmit()">
    <div id="fhlMsg" style="font-size:12px;min-height:18px;text-align:center;margin-bottom:8px;line-height:1.6"></div>

    <div style="display:flex;gap:8px">
      <button onclick="fhlSubmit()" style="flex:1;padding:11px;border:none;border-radius:8px;background:var(--red);color:#fff;font-family:'Noto Serif SC',serif;font-size:13px;cursor:pointer">对一句</button>
      <button onclick="fhlGiveUp()" style="padding:11px 18px;border:1px solid var(--light);border-radius:8px;background:transparent;color:var(--gray);font-family:'Noto Serif SC',serif;font-size:13px;cursor:pointer">认输</button>
    </div>`;
  }

  openDialog(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-family:'ZCOOL XiaoWei',serif;font-size:17px;color:var(--red);letter-spacing:2px">🎐 飞花令</div>
      <div onclick="closeDialog()" style="font-size:20px;color:var(--gray);cursor:pointer;padding:0 4px">×</div>
    </div>
    ${bodyHtml}
  `);
  // 自动聚焦输入框
  setTimeout(()=>{const inp=document.getElementById('fhlInput');if(inp)inp.focus()},50);
}

function fhlSubmit(){
  const inp=document.getElementById('fhlInput');
  const msg=document.getElementById('fhlMsg');
  if(!inp||!msg)return;
  const raw=inp.value.trim();
  if(!raw){msg.style.color='var(--gray)';msg.textContent='请先写一句';return}
  const s=fhlState;
  const normalized=normalizeAnswer(raw);

  // 1. 检查是否包含目标字
  if(!raw.includes(s.targetChar)){
    msg.style.color='var(--red)';
    msg.innerHTML=`这句里没有「${s.targetChar}」字`;
    return;
  }

  // 2. 已经答过
  if(s.answered.includes(normalized)){
    msg.style.color='var(--gray)';
    msg.textContent='这句你已经对过啦，再想一句';
    inp.value='';
    return;
  }

  // 3. 在已学诗中匹配：完全匹配或包含关系
  const hit=s.allMatches.find(m=>{
    const mn=normalizeAnswer(m.line);
    return mn===normalized||mn.includes(normalized)||normalized.includes(mn);
  });

  if(hit){
    s.answered.push(normalizeAnswer(hit.line));
    inp.value='';
    if(s.answered.length>=3){
      s.passed=true;s.finished=true;
      showFhlDialog();
    }else{
      msg.style.color='var(--green)';
      msg.innerHTML=`✓ 对得好！——《${hit.poemTitle}》`;
      // 刷新进度条区（简单做法：重绘整个dialog）
      setTimeout(()=>showFhlDialog(),900);
    }
  }else{
    s.attemptsLeft--;
    if(s.attemptsLeft<=0){
      s.finished=true;
      showFhlDialog();
    }else{
      msg.style.color='var(--red)';
      msg.innerHTML=`这句不在你学过的诗里，还剩 ${s.attemptsLeft} 次机会`;
    }
  }
}

function fhlGiveUp(){
  if(!confirm('确定认输？将直接看到这个字还有哪些句子可对。'))return;
  fhlState.finished=true;
  showFhlDialog();
}

    }).then(canvas=>{
      const dataUrl=canvas.toDataURL('image/png');
      wrap.innerHTML=`<img src="${dataUrl}" id="shareCardImg" alt="诗意卡片">`;
      // 保存按钮绑定
      document.getElementById('shareSaveBtn').onclick=()=>{
        const a=document.createElement('a');
        a.href=dataUrl;
        a.download=`诗隐_${p.title}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
    }).catch(err=>{
      console.error(err);
      wrap.innerHTML=`<div style="color:#fff;padding:40px;text-align:center;font-size:13px">生成失败，请稍后重试</div>`;
    });
  },100);
}

function closeShareCard(){
  const modal=document.getElementById('shareModal');
  modal.classList.remove('active');
  setTimeout(()=>{
    document.getElementById('shareCardStage').innerHTML='';
    document.getElementById('shareCardWrap').innerHTML='';
  },250);
}

</script>

<!-- 分享卡片 modal -->
<div class="share-modal" id="shareModal" onclick="if(event.target===this)closeShareCard()">
  <div class="share-modal-inner">
    <div class="share-card-wrap" id="shareCardWrap"></div>
    <div class="share-card-hint">长按图片可保存到相册 · 分享给好友</div>
    <div class="share-modal-btns">
      <button class="share-modal-btn secondary" onclick="closeShareCard()">关闭</button>
      <button class="share-modal-btn primary" id="shareSaveBtn">保存图片</button>
    </div>
  </div>
</div>

<div class="share-card-stage" id="shareCardStage"></div>
